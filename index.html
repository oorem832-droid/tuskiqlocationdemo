function supCheck(){
  const s=ui.sup;
  if(!s.section)return 'Choisissez la partie de la plateforme concernée.';
  if(!supInc(s)){
    if(String(s.did).trim().length<10)return 'Décrivez ce que vous voudriez pouvoir faire (au moins une phrase).';
    if(String(s.saw).trim().length<5)return 'Expliquez pourquoi cette demande est utile.';
    if(!s.urg)return 'Indiquez pour quand vous en avez besoin.';
    return '';
  }
  if(!s.kind)return 'Dites-nous ce qui se passe (type de problème).';
  if(supNeedsOrder(s)&&!s.noOrder&&!String(s.order).trim())return 'Indiquez le numéro de commande ou de facture, ou cochez « Aucune commande n’est concernée ».';
  if(/montant/.test(s.kind)&&(!String(s.shown).trim()||!String(s.expected).trim()))return 'Indiquez le montant affiché et le montant attendu.';
  if(String(s.did).trim().length<10)return 'Décrivez ce que vous faisiez, étape par étape (au moins une phrase).';
  if(/erreur/.test(s.kind)&&String(s.err).trim().length<3)return 'Recopiez le message d’erreur affiché à l’écran.';
  if(!s.urg)return 'Indiquez l’urgence du problème.';
  return '';
}
function supCopyText(msg,ok){
  const done=()=>toast(ok||'Message copié.');
  if(navigator.clipboard)navigator.clipboard.writeText(msg).then(done,()=>toast('Copie impossible : sélectionnez le message puis copiez-le (Ctrl+C).',1));
  else{const t=document.createElement('textarea');t.value=msg;document.body.appendChild(t);t.select();let r=false;try{r=document.execCommand('copy')}catch(e){}t.remove();r?done():toast('Copie impossible : sélectionnez le message puis copiez-le (Ctrl+C).',1)}
}

/* ============ propositions à valider par le manager (rebut, transformation, réparation) ============ */
const isProp=m=>m.type==='État'&&/^Proposition /.test(m.note||'');
const isDecis=m=>m.type==='État'&&/^Décision \[/.test(m.note||'');
const PROP_RE=/^Proposition (rebut|transformation|réparation) ×(\d+) depuis (dmg|maint|dispo)(?: en \[([^\]]+)\] ×(\d+))? — ([\s\S]*)$/;
const PROP_LABEL={rebut:'Mise au rebut',transformation:'Transformation',réparation:'Réparation'};
function parseProp(m){const x=PROP_RE.exec(m.note||'');return x?{kind:x[1],q:+x[2],from:x[3],pid2:x[4]||'',q2:+(x[5]||0),note:x[6]}:null}
function decisionOf(id){return S.moves.find(d=>isDecis(d)&&d.note.startsWith('Décision ['+id+']'))}
function pendingProps(){
  return S.moves.filter(isProp).filter(m=>!decisionOf(m.id)).map(m=>({m,p:prod(m.pid),d:parseProp(m)})).filter(x=>x.p&&x.d).sort((a,b)=>(b.m.at||b.m.date).localeCompare(a.m.at||a.m.date));
}
function propText(x){
  const d=x.d,p2=d.pid2?prod(d.pid2):null;
  return PROP_LABEL[d.kind]+' de '+d.q+' × '+x.p.name+' ('+SRC_LABEL[d.from]+')'+(p2?' en '+d.q2+' × '+p2.name:'')+' — '+d.note;
}
function propPanel(){
  const pend=pendingProps(),adm=me().role==='admin';
  const done=S.moves.filter(isProp).map(m=>({m,p:prod(m.pid),d:parseProp(m),dec:decisionOf(m.id)})).filter(x=>x.dec&&x.p&&x.d).sort((a,b)=>(b.dec.at||b.dec.date).localeCompare(a.dec.at||a.dec.date)).slice(0,8);
  if(!pend.length&&!done.length)return '';
  return `<section class="panel" style="margin-bottom:16px"><div class="panel-h"><h3>Propositions de l’entrepôt à valider par le manager</h3><small>${pend.length} en attente</small></div><div class="scroll"><table><tbody>${pend.map(x=>`<tr><td>${fdt(x.m.at||x.m.date)}</td><td><b>${esc(x.p.name)}</b><span class="sub">${esc(propText(x))}</span></td><td>${esc(staffName(x.m.by))}</td><td class="num">${adm?`<button class="btn sm primary" data-act="propOk" data-id="${x.m.id}">Valider</button> <button class="btn sm" data-act="propNo" data-id="${x.m.id}">Refuser</button>`:'<span class="badge b-warn">En attente du manager</span>'}</td></tr>`).join('')}${done.map(x=>{const ok=/validée/.test(x.dec.note);return `<tr><td>${fdt(x.dec.at||x.dec.date)}</td><td><b>${esc(x.p.name)}</b><span class="sub">${esc(propText(x))}</span></td><td>${esc(staffName(x.dec.by))}</td><td class="num"><span class="badge ${ok?'b-ok':'b-bad'}">${ok?'Validée':'Refusée'}</span>${ok?'':`<span class="sub">${esc(x.dec.note.replace(/^Décision \[[^\]]*\] refusée\s*—?\s*/,''))}</span>`}</td></tr>`}).join('')}</tbody></table></div></section>`;
}
function proposeForm(kind,pid){
  if(!can('transform')){toast('Droit insuffisant.',1);return}
  const p0=pid?prod(pid):null,tr=kind==='transformation';
  formModal({title:'Proposer : '+PROP_LABEL[kind].toLowerCase(),narrow:true,fields:[
    {k:'art',label:'Article',required:true,full:true,list:'plist',value:p0?p0.name:''},
    {k:'from',label:'Provenance',type:'select',full:true,value:'dmg',options:kind==='réparation'?[['dmg','Endommagé']]:[['dmg','Endommagé'],['maint','En entretien'],['dispo','Disponible en magasin']]},
    {k:'qty',label:'Quantité',type:'number',min:1,step:1,required:true,full:true,value:1},
    ...(tr?[{k:'art2',label:'Nouvel article obtenu',required:true,full:true,list:'plist',hint:'Par exemple des serviettes.'},{k:'qty2',label:'Quantité obtenue',type:'number',min:1,step:1,required:true,full:true,value:1}]:[]),
    {k:'note',label:'Motif (obligatoire)',required:true,full:true,hint:'Le manager valide ou refuse. Rien ne change dans le stock avant sa validation.'}],
   submit:'Envoyer au manager',onSubmit:v=>{
    if(!can('transform')){toast('Droit insuffisant.',1);return false}
    const p=findProd(v.art);if(!p){toast('Article introuvable : choisissez un nom du catalogue.',1);return false}
    const q=Math.round(v.qty);if(!(q>0)){toast('Quantité invalide.',1);return false}
    const have=srcHave(p,v.from);if(q>have){toast('Seulement '+have+' pièce(s) dans cet état.',1);return false}
    let tail='';
    if(tr){const p2=findProd(v.art2),q2=Math.round(v.qty2);
      if(!p2){toast('Nouvel article introuvable.',1);return false}
      if(p2.id===p.id){toast('Le nouvel article doit être différent.',1);return false}
      if(!(q2>0)){toast('Quantité obtenue invalide.',1);return false}
      tail=' en ['+p2.id+'] ×'+q2}
    addMove(p.id,'État',0,'','Proposition '+kind+' ×'+q+' depuis '+v.from+tail+' — '+v.note);
    save();render();toast('Proposition envoyée au manager pour validation.');
   }});
}
function propExec(x){
  const d=x.d,p=x.p;
  const have=srcHave(p,d.from);if(d.q>have){toast('Plus assez de pièces dans cet état ('+have+').',1);return false}
  if(d.kind==='réparation'){
    p.dmg-=d.q;p.maint=(p.maint||0)+d.q;
    addMove(p.id,'État',0,'','Réparation validée ×'+d.q+' : Endommagé → En entretien');return true}
  if(d.from==='maint')p.maint-=d.q;if(d.from==='dmg')p.dmg-=d.q;
  p.stock=Math.max(0,p.stock-d.q);
  if(d.kind==='rebut'){addMove(p.id,'Rebut',-d.q,'',SRC_LABEL[d.from]+' → Mis au rebut (sort du parc) — '+d.note);return true}
  const p2=prod(d.pid2);if(!p2){toast('Nouvel article introuvable.',1);return false}
  addMove(p.id,'Rebut',-d.q,'',SRC_LABEL[d.from]+' → Transformé en '+p2.name+' (×'+d.q2+') — '+d.note);
  p2.stock+=d.q2;addMove(p2.id,'Entrée',d.q2,'','Transformation : issu de '+p.name+' (×'+d.q+')');return true;
}
function propOk(id){
  if(me().role!=='admin'){toast('Seul le manager valide.',1);return}
  const x=pendingProps().find(y=>y.m.id===id);if(!x)return;
  confirmDialog('Valider cette proposition ?',propText(x),'Valider et appliquer',()=>{
    if(!propExec(x))return;
    addMove(x.p.id,'État',0,'','Décision ['+id+'] validée');save();render();toast('Proposition validée et appliquée au stock.');
  });
}
function propNo(id){
  if(me().role!=='admin'){toast('Seul le manager décide.',1);return}
  const x=pendingProps().find(y=>y.m.id===id);if(!x)return;
  formModal({title:'Refuser la proposition',narrow:true,fields:[{k:'r',label:'Raison (facultatif)',full:true,hint:propText(x)}],submit:'Refuser',onSubmit:v=>{
    addMove(x.p.id,'État',0,'','Décision ['+id+'] refusée'+(v.r?' — '+v.r:''));save();render();toast('Proposition refusée. Aucun changement de stock.');}});
}

const SIGN_MODES=[['Showroom : signature à la main','Showroom : signature à la main'],['À distance : signature électronique','À distance : signature électronique'],['À distance : devis signé renvoyé par le client','À distance : devis signé renvoyé par le client']];

function signForm(id){
  const r=byId(id);if(!r)return;if(!can('sign')){toast('Droit insuffisant.',1);return}
  const cl=client(r.clientId)||{};
  openModal('Facture signée : '+r.no,`<form id="sform" class="form" novalidate>
   <div class="field full"><label for="sg_mode">Mode de signature</label><select id="sg_mode" name="mode">${SIGN_MODES.map(([v,l])=>`<option ${v===r.signedMode?'selected':''}>${esc(l)}</option>`).join('')}</select></div>
   <div class="field"><label for="sg_on">Date de signature</label><input id="sg_on" name="on" type="date" value="${r.signedOn||TODAY}" required></div>
   <div class="field"><label for="sg_by">Signé par</label><input id="sg_by" name="by" value="${esc(r.signedBy||cl.name||'')}" required></div>
   <div class="field full"><label for="sg_file">Document signé (photo ou PDF, facultatif)</label><input id="sg_file" name="file" type="file" accept="image/*,application/pdf"><div class="hint">« Lu et approuvé », signature du client sur la facture et sur les conditions de location.${r.signedFile?' Un document est déjà enregistré : en choisir un autre le remplace.':''}</div></div>
   <div class="modal-foot"><button type="button" class="btn ghost" data-act="closeModal">Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div></form>`,{narrow:true});
  $('#sform').addEventListener('submit',async e=>{
    e.preventDefault();const f=e.target,on=f.on.value,by=f.by.value.trim();
    if(!on||!by){toast('Complétez la date et le nom.',1);return}
    const file=f.file.files[0];
    if(file&&file.size>8*1024*1024){toast('Fichier trop volumineux (8 Mo maximum).',1);return}
    let path=r.signedFile||'';
    if(file){
      if(typeof sb!=='undefined'&&sb&&sb.storage){
        const ext=(file.name.split('.').pop()||'bin').replace(/[^a-z0-9]/gi,'').toLowerCase().slice(0,5)||'bin';
        const np=r.id+'/'+Date.now()+'.'+ext;
        const up=await sb.storage.from('signed').upload(np,file,{contentType:file.type||'application/octet-stream'});
        if(up.error){toast('Le document n’a pas pu être envoyé : '+up.error.message,1);return}
        path=np;
      }else{path='demo:'+file.name}
    }
    r.signedOn=on;r.signedBy=by;r.signedMode=f.mode.value;r.signedFile=path;
    save();closeModal();render();toast('Facture signée enregistrée.');showRental(id);
  });
}
async function signView(id){

}

function vReports(){
  const per=ui.period,from=ui.rmonth?ui.rmonth+'-01':per==='all'?'0000-01-01':addD(TODAY,-parseInt(per,10)),to=ui.rmonth?ui.rmonth+'-31':'9999-12-31';
  const rs=S.rentals.filter(r=>live(r)&&r.start>=from&&(ui.rmonth?r.start<=to:r.start<=TODAY));
  const ca=rs.reduce((a,r)=>a+total(r),0);
  const cash=S.rentals.flatMap(r=>r.payments).filter(p=>p.date>=from&&p.date<=to&&p.kind!=='caution').reduce((a,p)=>a+p.amount,0);
  const due=S.rentals.filter(live).reduce((a,r)=>a+Math.max(0,balance(r)),0);
  const pipe=S.rentals.filter(r=>(r.status==='Confirmée')&&r.start>TODAY).reduce((a,r)=>a+total(r),0);
  const cats={},items={},cl={};
  rs.forEach(r=>{r.lines.forEach(l=>{const p=prod(l.pid);cats[p.cat]=(cats[p.cat]||0)+l.qty*l.price*nDays(r);items[p.id]=(items[p.id]||0)+l.qty*nDays(r)});cl[r.clientId]=(cl[r.clientId]||0)+total(r)});
  const topItems=Object.entries(items).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([id,v])=>({l:prod(id).name,v}));
  const topCl=Object.entries(cl).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([id,v])=>({l:(client(id)||{}).name,v}));
  const losses=S.moves.filter(m=>m.type==='Perte'&&m.date>=from&&m.date<=to);const lossVal=losses.reduce((a,m)=>a-m.qty*(prod(m.pid)||{cost:0}).cost,0);
  const lossBy={};losses.forEach(m=>{lossBy[m.pid]=(lossBy[m.pid]||0)-m.qty});
  const stockVal=S.products.reduce((a,p)=>a+p.stock*p.cost,0);
  const spend=S.purchases.filter(p=>p.date>=from&&p.date<=to).reduce((a,p)=>a+p.lines.reduce((b,l)=>b+l.qty*l.cost,0),0);
  const used90=new Set();S.rentals.filter(r=>live(r)&&r.end>=addD(TODAY,-90)).forEach(r=>r.lines.forEach(l=>used90.add(l.pid)));
  const idle=S.products.filter(p=>!used90.has(p.id));
  const pr=[['30','30 jours'],['90','90 jours'],['365','12 mois'],['all','Tout']];
  return `<div class="bar-row noprint"><div class="chips">${pr.map(([v,l])=>`<button class="chip ${!ui.rmonth&&per===v?'on':''}" data-act="period" data-v="${v}">${l}</button>`).join('')}${ui.rmonth?`<button class="chip on" data-act="rmonth" data-v="${ui.rmonth}" title="Revenir à la période">${monthLabel(ui.rmonth)} ✕</button>`:''}</div><span class="grow"></span><button class="btn" data-act="csvRentals">${ic('copy',16)} Export locations</button><button class="btn" data-act="csvStock">${ic('copy',16)} Export stock</button><button class="btn primary" data-act="printPage">${ic('print',16)} Imprimer</button></div>
  <div class="kpis"><div class="kpi"><span>Chiffre d’affaires</span><b>${F(ca)}</b><small>${rs.length} locations${ui.rmonth?' · '+monthLabel(ui.rmonth):''}</small></div><div class="kpi"><span>Encaissé</span><b>${F(cash)}</b><small>${ui.rmonth?'sur le mois':'sur la période'}</small></div><div class="kpi"><span>Reste à encaisser</span><b>${F(due)}</b><small>toutes locations</small></div><div class="kpi"><span>Carnet à venir</span><b>${F(pipe)}</b><small>locations confirmées</small></div></div>
  <div class="cols"><div class="stack">
   <section class="panel chart"><div class="panel-h"><h3>Chiffre d’affaires par mois</h3><small>6 derniers mois · cliquez sur un mois pour filtrer le rapport</small></div>${barChart(monthly(6),null,ui.rmonth)}</section>
   <section class="panel"><div class="panel-h"><h3>Chiffre d’affaires par famille</h3><small>location seule, hors transport · cliquez pour le détail</small></div>${hbars(Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([l,v])=>({l,v,c:CATCOL[l],d:['famDetail',l]})),F)}</section>
   <section class="panel"><div class="panel-h"><h3>Articles les plus loués</h3><small>pièces × jours</small></div>${hbars(topItems,v=>money(v))}</section>
  </div><div class="stack">
   <section class="panel"><div class="panel-h"><h3>Meilleurs clients</h3></div>${hbars(topCl,F)}</section>
   <section class="panel"><h3>Stock & pertes</h3><div class="hb" style="grid-template-columns:1fr auto"><span>Valeur du parc (coût d’achat)</span><b>${F(stockVal)}</b></div><div class="hb" style="grid-template-columns:1fr auto"><span>Achats sur la période</span><b>${F(spend)}</b></div><div class="hb" style="grid-template-columns:1fr auto"><span>Pièces perdues ou cassées</span><b>${losses.reduce((a,m)=>a-m.qty,0)}</b></div><div class="hb" style="grid-template-columns:1fr auto"><span>Valeur des pertes</span><b class="neg">${F(lossVal)}</b></div>${Object.keys(lossBy).length?`<p class="hint" style="margin-bottom:0">${Object.entries(lossBy).slice(0,4).map(([id,q])=>esc(prod(id).name)+' ('+q+')').join(', ')}</p>`:''}</section>
   <section class="panel click" data-act="dormDetail" title="Voir la liste détaillée" style="cursor:pointer"><h3>Articles dormants <small style="font-weight:600;color:var(--rose)">voir le détail ›</small></h3><p style="margin-top:0">${idle.length} article${idle.length>1?'s':''} sans location depuis 90 jours.</p><p class="hint" style="margin-bottom:0">${idle.slice(0,6).map(p=>esc(p.name)).join(' · ')}${idle.length>6?' …':''}</p></section>
  </div></div>`;
}

function regul(id){
  const r=byId(id);

  });

function cancelRental(id){
  const r=byId(id),pay=paid(r),cau=cautionPaid(r),isHold=r.status==='Pré-réservation';
  const done=()=>{r.status='Annulée';r.holdUntil=null;r.cancelledAt=nowLocal();r.cancelledBy=S.me;save();render();toast('Commande annulée.');showRental(id)};
  if(!(pay>0||cau>0)){confirmDialog(isHold?'Libérer le stock ?':'Annuler la commande ?','Les articles redeviennent disponibles.','Confirmer',done);return}
  const s=refundSuggest(r),h=Math.floor(Math.abs(s.hours));
  const rule=s.full?'Annulation faite plus de '+CANCEL_HOURS+' h avant la livraison ('+(s.hours>0?'dans '+h+' h':'')+') : remboursement total proposé (article 10).':'Annulation faite moins de '+CANCEL_HOURS+' h avant la livraison'+(s.hours>0?' (dans '+h+' h)':' (date dépassée)')+' : '+(100-CANCEL_KEEP)+' % de la commande est restitué (article 10). La caution est restituée en totalité.';
  formModal({title:'Annuler la commande',narrow:true,fields:[
    {k:'loc',label:'Remboursement de la commande (F)',type:'number',value:s.loc,min:0,full:true,hint:rule+' Payé : '+F(pay)+'. Vous pouvez modifier le montant.'},
    {k:'caut',label:'Restitution de la caution (F)',type:'number',value:s.caut,min:0,full:true,hint:'Caution reçue : '+F(cau)},
    {k:'method',label:'Moyen de remboursement',type:'select',options:PAY,full:true},
    {k:'note',label:'Motif ou remarque (facultatif)',full:true}
  ],submit:'Annuler et enregistrer',onSubmit:v=>{
    const L=Math.round(v.loc||0),C=Math.round(v.caut||0);
    if(L<0||C<0||L>pay||C>cau){toast('Les montants ne peuvent pas dépasser ce qui a été payé ('+F(pay)+' et '+F(cau)+').',1);return false}
    const mk=(amt,kind)=>({id:uid('y'),date:TODAY,at:nowLocal(),amount:-amt,method:v.method,by:S.me,kind,refund:true,note:v.note||''});
    if(L>0)r.payments.push(mk(L,'location'));
    if(C>0)r.payments.push(mk(C,'caution'));
    done();
  }});
}

  care:(el,ev)=>{if(ev.type!=='change')return;ui.careWho=el.value;render()},
  rq:el=>{ui.rq=el.value;$('#rtable').innerHTML=rentalsTable(rentalRows())},
  sq:el=>{ui.sq=el.value;ui.slimit=60;$('#stable').innerHTML=stockTable(filterProducts())},
  dcat:el=>{ui.dcat=el.value;dormantDetail()},
  scat:el=>{ui.scat=el.value;ui.slimit=60;$('#stable').innerHTML=stockTable(filterProducts())},
  cq:el=>{ui.cq=el.value;const pos=el.selectionStart;render();const n=$('[data-in=cq]');if(n){n.focus();n.setSelectionRange(pos,pos)}},
  pq:el=>{ui.draft.q=el.value;drawTiles()},
  cdate:el=>{ui.cashDate=el.value||TODAY;render()},
  user:el=>{S.me=el.value;save();render()},
  sup:(el,ev)=>{if(!ui.sup)return;const k=el.dataset.k;ui.sup[k]=el.type==='checkbox'?(el.checked?'1':''):el.value;supRefresh(ev.type==='change'&&(k==='section'||k==='kind'||k==='noOrder'))},
  pack:(el,ev)=>{if(ev.type!=='change')return;applyPack(el.dataset.id,el.value)},
  qty:(el,ev)=>{if(ev.type!=='change')return;setQty(el.dataset.id,Math.max(0,Math.round(num(el.value))))},
  settle:el=>{const f=$('#sform');if(!f)return;const ld=Math.max(0,diff(f.dataset.end,el.value||f.dataset.end)),L=Math.round(ld*num(f.dataset.rate));$('#slate').value=L;$('#slh').textContent=ld+' jour(s) de retard';const C=num(f.dataset.d)+L,cp=num(f.dataset.cp),ret=Math.min(cp,C);$('#sret').value=ret;$('#sfees').value=Math.max(0,C-ret)},
  settle2:el=>{const f=$('#sform');if(!f)return;const C=num(f.dataset.d)+Math.max(0,num(el.value)),cp=num(f.dataset.cp),ret=Math.min(cp,C);$('#sret').value=ret;$('#sfees').value=Math.max(0,C-ret)},
  lost:(el)=>{const f=$('#rret'),g=$('#rfees'),form=$('#rform');if(!f||!g||!form)return;let t=0;$$('input[data-in=lost]').forEach(i=>{const m=/_(.+)$/.exec(i.name);const p=m&&prod(m[1]);if(p)t+=Math.max(0,num(i.value))*repl(p)});const cp=num(form.dataset.cp);f.value=Math.min(t,cp);g.value=Math.max(0,t-cp)},
  d:(el,ev)=>{
    const d=ui.draft,k=el.dataset.k;
    if(k==='start'||k==='end'||k==='delivDate'||k==='pickDate'){if(ev.type!=='change'||!el.value)return;d[k]=el.value;if(d.end<d.start){d.end=d.start}
      if(d.delivDate&&d.delivDate>d.start)d.delivDate='';if(d.pickDate&&d.pickDate<d.end)d.pickDate='';
      d.lines.forEach(l=>{const a=avail(prod(l.pid),d.delivDate||d.start,d.pickDate||d.end,d.editId);if(l.qty>a){toast(`« ${prod(l.pid).name} » : quantité réduite à ${Math.max(0,a)} pour ces dates.`,1);l.qty=Math.max(0,a)}});
      d.lines=d.lines.filter(l=>l.qty>0);drawTiles();drawCart();drawSlots();{const l1=$('label[for="d_ds"]'),l2=$('label[for="d_ps"]');if(l1)l1.textContent='Créneau de livraison (le '+fd(d.delivDate||d.start,1)+')';if(l2)l2.textContent='Créneau de récupération (le '+fd(d.pickDate||d.end,1)+')';const a1=$('#d_dd'),a2=$('#d_pd');if(a1){a1.max=d.start;a1.value=d.delivDate||d.start}if(a2){a2.min=d.end;a2.value=d.pickDate||d.end}}return}
    d[k]=el.type==='number'?num(el.value):el.value;
    if(k==='delivSlot'||k==='pickSlot'){drawSlots();return}
    if(k==='discPct'){d.discPct=Math.min(100,Math.max(0,num(el.value)));if(num(el.value)>100)el.value=100}
    if(['delivery','discPct'].includes(k)&&termsOf(d.clientId))d.termsOff=true;
    if(k==='clientId'){onClientPick(d);drawCart();return}
    if(k==='commune'){d.zone='';setTransport(d);drawCart();return}
    if(k==='zone'){setTransport(d);drawCart();return}
    if(['delivery','discPct','payAmount','cautionPay'].includes(k)){$('#ctot').innerHTML=totalsHtml();if(k==='discPct'&&$('#d_remamt'))$('#d_remamt').textContent=d.discPct?'Remise calculée : − '+F(discAmt(d)):'Saisissez un pourcentage : le montant est calculé automatiquement.';const c=draftCalc();if($('#h_pay'))$('#h_pay').textContent=F(c.t);if($('#h_cau'))$('#h_cau').textContent=F(c.caution)}
  }
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f)f(el,e)});
['input','change'].forEach(t=>document.addEventListener(t,e=>{
  const el=e.target.closest('[data-in]');if(!el)return;const n=el.dataset.in;
  const live=['rq','sq','cq','pq','lost','d','sup'];
  if(t==='input'&&!live.includes(n))return;
  if(t==='input'&&n==='d'&&(['start','end','delivDate','pickDate'].includes(el.dataset.k)))return;
  if(t==='change'&&['rq','sq','cq','pq'].includes(n)&&el.type==='search')return;
  const f=INP[n];if(f)f(el,e);
}));
document.addEventListener('submit',e=>{
  if(e.target.id!=='setform')return;e.preventDefault();
  if(!ACT_ROLES.team.includes(me().role)){toast('Réservé à l’administrateur.',1);return}
  const d=new FormData(e.target),rate=num(d.get('rate')),h=Math.round(num(d.get('hold')));
  if(rate<0||rate>100){toast('Le taux doit être compris entre 0 et 100 %.',1);return}
  S.settings.conditions=String(d.get('cond')||'').trim()||DEFAULT_CONDITIONS.join('\n');S.settings.depositRate=rate;S.settings.holdMaxHours=Math.min(3,Math.max(1,h));save();render();toast('Règles enregistrées.');
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();ACT.closeNav()}});

/* ============ démarrage ============ */
S=load();
if(!S||!S.products){S=seed();save()}
render();
setInterval(()=>{if(!$('#modal-root').firstChild&&ui.view!=='pos'&&expireHolds()){save();render()}},30000);

})();
</script>
</body>
</html>
