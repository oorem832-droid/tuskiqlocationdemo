<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F5F8FA">
<meta name="robots" content="noindex,nofollow">
<title>TuskIQ Location — Démo de gestion de location</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F8FA;--surface:#FFFFFF;--surface-2:#EEF4F6;--ink:#252B35;--muted:#686E79;--line:#DCE6E8;
  --rose:#459EA8;--rose-ink:#FFFFFF;--rose-soft:#DCF2F5;--wine:#1A464E;--wine-2:#2A606B;--gold:#9A7A2E;
  --sage:#3D6A4D;--sage-soft:#DCEBDF;--amber:#8A5A0B;--amber-soft:#F8EBCB;--red:#A23232;--red-soft:#F7D9D9;
  --plum:#3B5B6B;--plum-soft:#E1ECF2;--pop:0 18px 50px -12px rgba(50,15,35,.35);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media not all{
  :root:not([data-theme="light"]){
    --bg:#121219;--surface:#1A1B25;--surface-2:#212330;--ink:#EBF3F2;--muted:#9FA4B3;--line:#2F3241;
    --rose:#8BDCE5;--rose-ink:#0F292A;--rose-soft:#223B37;--wine:#0F282A;--wine-2:#163A3D;--gold:#D8B45A;
    --sage:#7CC293;--sage-soft:#1F3328;--amber:#E5B455;--amber-soft:#3B2E14;--red:#F08A8A;--red-soft:#432020;
    --plum:#A5D9F0;--plum-soft:#284350;--pop:0 18px 50px -12px rgba(0,0,0,.7);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121219;--surface:#1A1B25;--surface-2:#212330;--ink:#EBF3F2;--muted:#9FA4B3;--line:#2F3241;
  --rose:#8BDCE5;--rose-ink:#0F292A;--rose-soft:#223B37;--wine:#0F282A;--wine-2:#163A3D;--gold:#D8B45A;
  --sage:#7CC293;--sage-soft:#1F3328;--amber:#E5B455;--amber-soft:#3B2E14;--red:#F08A8A;--red-soft:#432020;
  --plum:#A5D9F0;--plum-soft:#284350;--pop:0 18px 50px -12px rgba(0,0,0,.7);color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;margin:0;letter-spacing:.005em}
h2{font-size:1.55rem;line-height:1.15}
h3{font-size:1.2rem}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{background:var(--wine);color:#E9F5F7;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;padding:22px 14px 16px;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 18px}
.brand svg{flex:none}
.brand b{display:block;font-family:'Cormorant Garamond',serif;font-size:1.6rem;letter-spacing:.14em;line-height:1;font-weight:600}
.brand small{display:block;color:#C9E5E9;font-size:.76rem;margin-top:4px}
.nav{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-radius:10px;padding:10px 12px;color:#D3E7EB;cursor:pointer;text-align:left;font-weight:600;position:relative}
.nav:hover{background:rgba(255,255,255,.07)}
.nav.on{background:rgba(255,255,255,.13);color:#fff}
.nav.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:#A0E0E8}
.nav .cnt{margin-left:auto;background:#A0E0E8;color:#1A464E;border-radius:99px;font-size:.72rem;padding:1px 8px;font-weight:800}
.nav.cta{background:#A0E0E8;color:#1A464E;margin-bottom:12px;font-weight:800}
.nav.cta:hover{background:#B4E9F0}
.side-foot{margin-top:auto;padding:14px 8px 0;font-size:.78rem;color:#B8D6D9;border-top:1px solid rgba(255,255,255,.12)}
.side-foot button{background:none;border:0;color:#D3EEF2;text-decoration:underline;cursor:pointer;padding:0;font-size:.78rem}
.main{padding:0 30px 70px;min-width:0}
.top{display:flex;align-items:center;gap:14px;padding:18px 0 14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.top h1{font-size:1.9rem;line-height:1;flex:1}
.top select{max-width:230px}
.menu-btn{display:none}
.scrim{display:none}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{border-color:var(--rose)}

/* controls */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:700;white-space:nowrap}
.btn:hover{border-color:var(--rose)}
.btn.primary{background:var(--rose);border-color:var(--rose);color:var(--rose-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.sm{padding:5px 10px;font-size:.86rem;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--rose);outline-offset:0;border-color:var(--rose)}
.search{position:relative;flex:1;min-width:200px;max-width:380px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:36px}
.bar-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:4px 0 16px}
.bar-row .grow{flex:1}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-weight:700;font-size:.86rem}
.hint{font-size:.8rem;color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .full,.modal-foot{grid-column:1/-1}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:99px;cursor:pointer;font-weight:600;font-size:.88rem;color:var(--ink)}
.chip.on{background:var(--rose);border-color:var(--rose);color:var(--rose-ink)}
.chip small{opacity:.75;margin-left:4px}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.panel>h3{margin-bottom:12px}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.panel-h small{color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.82rem;color:var(--muted);font-weight:700;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr[data-act]{cursor:pointer}
tbody tr[data-act]:hover td{background:var(--surface-2)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th.num{text-align:right}
.sub{display:block;color:var(--muted);font-size:.84rem}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:800;white-space:nowrap}
.b-ok{background:var(--sage-soft);color:var(--sage)}
.b-warn{background:var(--amber-soft);color:var(--amber)}
.b-bad{background:var(--red-soft);color:var(--red)}
.b-info{background:var(--plum-soft);color:var(--plum)}
.b-mute{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line)}
.empty{padding:34px 10px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.pos{color:var(--sage)}.neg{color:var(--red)}

/* dashboard */
.hello{margin:2px 0 18px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:20px}
.kpi{padding:16px 20px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi span{display:block;color:var(--muted);font-size:.86rem}
.kpi b{display:block;font-family:'Cormorant Garamond',serif;font-size:1.85rem;line-height:1.15;font-weight:700}
.kpi small{color:var(--muted)}
.tl{display:grid;grid-template-columns:150px repeat(14,minmax(30px,1fr));min-width:640px;font-size:.84rem}
.tl-h{padding:4px 0 8px;text-align:center;color:var(--muted);font-weight:700;line-height:1.2}
.tl-h.today{color:var(--rose)}
.tl-h i{display:block;font-style:normal;font-size:1.05rem;color:var(--ink)}
.tl-h.today i{color:var(--rose)}
.tl-l{padding:7px 8px 7px 0;border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;cursor:pointer}
.tl-c{border-top:1px solid var(--line);border-left:1px dashed var(--line)}
.tl-c.we{background:var(--surface-2)}
.tl-c.today{background:var(--rose-soft)}
.tl-b{margin:6px 2px;border-radius:8px;padding:2px 8px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;z-index:1;border:0;text-align:left}
.tl-b.s-conf{background:var(--plum);color:var(--bg)}
.tl-b.s-out{background:var(--amber);color:var(--bg)}
.tl-b.s-dev{background:var(--surface);border:2px dashed var(--muted);color:var(--ink)}
.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start;cursor:pointer}
.todo li:first-child{border-top:0;padding-top:0}
.todo .dot{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.todo b{display:block}
.todo small{color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.chart .bar{fill:var(--rose)}
.chart .bar.cur{fill:var(--wine-2)}
.chart text{fill:var(--muted);font-size:11px;font-family:'Nunito Sans',sans-serif}
.chart .val{fill:var(--ink);font-weight:700}
.chart .axis{stroke:var(--line)}
.chart .bar.sel{fill:var(--wine-2);stroke:var(--rose);stroke-width:2}
.chart g[data-act]:hover .bar{filter:brightness(1.08)}
.chart g{transition:opacity .25s ease}
.chart g[data-act] .bar:not([fill]){transform-box:fill-box;transform-origin:bottom;animation:grow .45s ease}
@keyframes grow{from{transform:scaleY(.05)}to{transform:scaleY(1)}}
.hb.click{cursor:pointer;border-radius:8px}
.hb.click:hover{background:var(--surface-2)}
.hb{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;padding:5px 0;font-size:.92rem}
.hb .t{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.hb .t i{display:block;height:100%;border-radius:6px;background:var(--rose)}

/* POS */
.pos-wrap{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:12px}
.tile{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c,var(--rose));border-radius:12px;padding:8px 10px 10px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.tile:hover{border-color:var(--rose);border-left-color:var(--c,var(--rose))}
.tile .ph{display:flex;align-items:center;justify-content:center;height:112px;background:#fff;border-radius:8px;margin-bottom:5px;overflow:hidden}
.tile .ph img{max-width:100%;max-height:100%;object-fit:contain}
.tile .n{font-weight:700;line-height:1.25}
.tile .m{color:var(--muted);font-size:.84rem}
.tile .p{font-weight:800;margin-top:auto}
.tile.out{opacity:.5;cursor:not-allowed}
.tile .in{position:absolute;z-index:1;top:12px;right:12px;background:var(--rose);color:var(--rose-ink);border-radius:99px;font-size:.78rem;font-weight:800;padding:0 8px}
.cart{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--pop);max-height:calc(100vh - 100px);overflow-y:auto}
.cart .form{grid-template-columns:1fr 1fr;gap:10px}
.cart h3{margin-bottom:10px}
.th{width:44px;height:44px;border-radius:8px;background:#fff;object-fit:contain;border:1px solid var(--line);flex:none}
.th0{display:inline-block;background:var(--surface-2)}
.pc{display:flex;align-items:center;gap:10px}
.bigph{background:#fff;border-radius:12px;height:210px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;border:1px solid var(--line)}
.bigph img{max-height:100%;max-width:100%;object-fit:contain}
.cl{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.cl .nm{font-weight:700;line-height:1.25}
.cl-pack{display:flex;gap:8px;align-items:center;padding:6px 8px;margin:0 0 6px;background:var(--rose-soft);border-radius:8px;font-size:.82rem}.cl-pack label{font-weight:700;color:var(--wine);white-space:nowrap}.cl-pack select{flex:1;min-width:0}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{background:var(--surface-2);border:0;padding:5px 8px;cursor:pointer;display:grid;place-items:center}
.step input{width:56px;border:0;border-radius:0;text-align:center;padding:5px 2px}
.tot{margin-top:12px;border-top:2px solid var(--ink);padding-top:10px}
.tot div{display:flex;justify-content:space-between;padding:2px 0}
.tot .big{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:700;padding-top:6px}
.warn-box{background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:8px 12px;font-size:.88rem;margin:8px 0;font-weight:600}

/* modal & toast */
.ov{position:fixed;inset:0;background:rgba(30,10,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:calc(30px + env(safe-area-inset-top,0px)) 16px calc(30px + env(safe-area-inset-bottom,0px));overflow-y:auto;z-index:50}
.dlg{background:var(--surface);border-radius:16px;box-shadow:var(--pop);width:min(720px,100%);padding:22px 24px}
.dlg.narrow{width:min(520px,100%)}
.dlg-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.dlg-h h2{flex:1}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:12px 0 16px}
.kv div{background:var(--surface-2);border-radius:10px;padding:9px 12px}
.kv span{display:block;color:var(--muted);font-size:.8rem}
.kv b{display:block}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:90;align-items:center;pointer-events:none}
.toast{background:var(--wine);color:#fff;border-radius:12px;padding:10px 16px;font-weight:600;box-shadow:var(--pop);max-width:90vw}
.toast.err{background:var(--red);color:#fff}
@media not all{:root:not([data-theme="light"]) .toast.err{color:#0F292A}}
textarea.csv{font-family:ui-monospace,Menlo,monospace;font-size:.8rem;min-height:260px;white-space:pre}
#print{display:none}

@media (max-width:1100px){
  .pos-wrap{grid-template-columns:minmax(0,1fr)}
  .cart{position:static;max-height:none}
  .cols{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .main,.stack,.panel,.cols>*,.pos-wrap>*{min-width:0}
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:270px;z-index:60;transform:translateX(-105%);transition:transform .2s ease;padding-top:calc(22px + env(safe-area-inset-top,0px))}
  .app.nav-open .side{transform:none}
  .app.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(30,10,20,.5);z-index:55}
  .menu-btn{display:inline-flex}
  .main{padding:0 14px 60px}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
  .form{grid-template-columns:1fr}
  .top h1{font-size:1.5rem}
  .hb{grid-template-columns:110px 1fr auto}
}

.refs{display:block;font-size:.72rem;color:var(--muted);font-weight:600;white-space:nowrap}
/* téléphone */
@media (max-width:600px){
  html{-webkit-text-size-adjust:100%}
  input,select,textarea{font-size:16px;min-height:44px}   /* évite le zoom automatique sur iPhone */
  .btn{min-height:44px}
  .main{padding:0 12px 70px}
  .top{gap:8px;padding:12px 0 10px;flex-wrap:wrap}
  .top h1{font-size:1.3rem;min-width:0}
  .userbox{margin-left:auto;gap:8px}
  .who{display:none}
  #userSel{max-width:140px}
  .top .btn.sm{min-height:40px;padding:6px 10px;white-space:nowrap}
  td:first-child,th:first-child,td.num,th.num,td:nth-child(3){white-space:nowrap}
  td:nth-child(2){min-width:150px}
  .scroll::after{content:'';display:block;height:1px}
  .kpi{padding:12px 14px}
  .kpi b{font-size:1.35rem}
  .panel{padding-left:12px;padding-right:12px}
  .panel-h{flex-wrap:wrap;gap:4px}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{font-size:.9rem}
  th,td{padding:8px 8px}
  .hb{grid-template-columns:84px 1fr auto}
  .modal-foot{flex-wrap:wrap}
  .modal-foot .btn{flex:1}
  .toast{max-width:94vw}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* impression */
@media print{
  @page{size:A4;margin:9mm}
  #print .sig{margin-top:28px!important}
  body{background:#fff;color:#000}
  body.printing .app,body.printing #modal-root,body.printing #toasts{display:none!important}
  body.printing #print{display:block}
  body:not(.printing) .side,body:not(.printing) .top,body:not(.printing) .noprint,body:not(.printing) #toasts{display:none!important}
  body:not(.printing) .app{display:block}
  .main{padding:0}
  .panel{break-inside:avoid}
  :root{padding:0}
}
#print{font-family:'Nunito Sans',Arial,sans-serif;color:#222;padding:10px 6px}
#print h1{font-size:2rem;margin:0}
#print table{margin:16px 0}
#print th,#print td{border-bottom:1px solid #ccc;color:#222;padding:6px 8px}
#print .meta{display:flex;justify-content:space-between;gap:20px;margin-top:10px;font-size:.92rem}
#print .sig{display:flex;gap:40px;margin-top:50px}
#print .sig div{flex:1;border-top:1px solid #444;padding-top:6px;font-size:.85rem}

.b-plum{background:var(--plum);color:#fff}
.tl-b.s-hold{background:repeating-linear-gradient(45deg,#E9C98A,#E9C98A 6px,#F3DDB0 6px,#F3DDB0 12px);color:var(--ink);border:1px solid var(--amber)}
.steps{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line,#ddd)}
.steps li{position:relative;padding:4px 0 10px 14px;display:flex;flex-direction:column}
.steps li::before{content:"";position:absolute;left:-21px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--plum)}
.steps li span{color:var(--muted);font-size:.85rem}
/* thème clair par défaut, barre latérale claire */
:root:not([data-theme="dark"]) .side{background:var(--surface);color:var(--ink);border-right:1px solid var(--line)}
:root:not([data-theme="dark"]) .brand b{color:var(--wine)}
:root:not([data-theme="dark"]) .brand svg circle{stroke:var(--rose)}
:root:not([data-theme="dark"]) .brand svg path{stroke:var(--wine)}
:root:not([data-theme="dark"]) .brand small{color:var(--muted)}

.chk{display:inline-flex;gap:8px;align-items:center;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.sup-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:start}
.sup-form .field{margin-bottom:12px}.sup-form textarea{resize:vertical}
.sup-tip{background:var(--rose-soft);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:.92rem}
.sup-prev{white-space:pre-wrap;word-break:break-word;background:var(--surface-2,#EEF4F6);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:inherit;font-size:.88rem;max-height:420px;overflow:auto;margin:0 0 12px}

.sup-done{background:#DCEBDF;border-radius:10px;padding:10px 12px;margin-top:10px}
.sup-err{color:var(--red);font-weight:700;min-height:1.2em;margin-bottom:8px}
@media(max-width:900px){.sup-grid{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}

/* état affiché d'un article : Disponible / Réservé / Loué / En entretien / Endommagé (comptage par quantités) */
function pBreak(p){
  const out=outNow(p.id),res=reserved(p.id,TODAY,TODAY)-out;
  return {dispo:Math.max(0,avail(p,TODAY,TODAY)),reserve:Math.max(0,res),loue:out,maint:p.maint||0,dmg:p.dmg||0};
}
function pStatus(p){const a=avail(p,TODAY,TODAY);if(usable(p)<=0)return['Indisponible','b-bad'];if(a<=0)return['Tout est pris','b-warn'];if(a<=p.min)return['Stock bas','b-warn'];return['OK','b-ok']}
function addMove(pid,type,qty,ref,note){const at=nowLocal();S.moves.push({id:uid('m'),date:at.slice(0,10),at,seq:++S.seq.move,pid,type,qty,ref:ref||'',note:note||'',by:S.me})}
/* états de la caution */
const DEP={pend:'À restituer',part:'Partiellement retenue',held:'Retenue',closed:'Clôturée'};
const depBadge=r=>{
  if(!r.deposit)return '<span class="badge b-mute">Sans caution</span>';
  if(r.status==='Retournée')return `<span class="badge ${r.depositState==='Retenue'?'b-bad':r.depositState==='Partiellement retenue'?'b-warn':r.depositState==='Clôturée'?'b-ok':'b-info'}">${esc(r.depositState)}</span>`;
  return cautionPaid(r)>=r.deposit?'<span class="badge b-ok">Encaissée</span>':'<span class="badge b-warn">À encaisser</span>';
};
/* expiration automatique des pré-réservations (règle métier : pas d'avance dans le délai → expirée, stock libéré) */
function expireHolds(){
  let n=0;S.rentals.forEach(r=>{if(r.status==='Pré-réservation'&&r.holdUntil&&new Date(r.holdUntil)<=new Date()){r.status='Expirée';r.expiredAt=r.holdUntil;n++}});
  return n;
}
function holdLeft(r){const ms=new Date(r.holdUntil)-new Date();if(ms<=0)return 'expirée';const m=Math.ceil(ms/6e4);return m>=60?Math.floor(m/60)+' h '+String(m%60).padStart(2,'0'):m+' min'}

/* solde en magasin après chaque mouvement : calculé en remontant depuis le stock actuel */
function moveDelta(m){
  const q=m.qty,n=m.note||'';
  if(m.type==='État'){ if(/^(Disponible|Loué) →/.test(n))return -q; if(/→ Disponible/.test(n))return q; return 0 }
  if(m.type==='Rebut'||m.type==='Perte'){ if(m.ref||/^(Endommagé|En entretien) →/.test(n))return 0; return q }
  return q;
}
function moveBalances(){
  const by={},out={};
  S.moves.forEach(m=>{(by[m.pid]=by[m.pid]||[]).push(m)});
  Object.keys(by).forEach(pid=>{
    const p=prod(pid);if(!p)return;
    const l=by[pid].sort((a,b)=>(a.at||a.date).localeCompare(b.at||b.date)||a.seq-b.seq);
    let cur=Math.max(0,usable(p)-outNow(pid));
    for(let i=l.length-1;i>=0;i--){out[l[i].id]=cur;cur-=moveDelta(l[i])}
  });
  return out;
}

/* demandes d'avis (ex. quelle transformation pour une pièce abîmée) : l'entretien demande, le commercial ou un collaborateur répond */
const isAdvice=m=>m.type==='État'&&/^Avis/.test(m.note||'');
function pendingAdvice(){
  return S.moves.filter(m=>isAdvice(m)&&/^Avis demandé/.test(m.note)).filter(q=>!S.moves.some(a=>isAdvice(a)&&/^Avis réponse/.test(a.note)&&a.note.includes('['+q.id+']'))).map(q=>({m:q,p:prod(q.pid)})).filter(x=>x.p).sort((a,b)=>(b.m.at||b.m.date).localeCompare(a.m.at||a.m.date));
}
function adviceAnswers(id){return S.moves.filter(a=>isAdvice(a)&&/^Avis réponse/.test(a.note)&&a.note.includes('['+id+']'))}
/* signalements (entretien ou commercial) : la remise en stock ou le rebut reste décidé par le stock */
const isSignal=m=>m.type==='État'&&/^Signalement/.test(m.note||'');
function pendingSignals(){
  const ord=(a,b)=>(a.at||a.date).localeCompare(b.at||b.date)||a.seq-b.seq;
  const out=[];
  S.moves.filter(isSignal).forEach(s=>{
    const handled=S.moves.some(m=>m.pid===s.pid&&!isSignal(m)&&ord(m,s)>0&&(m.type==='Rebut'||/→ Disponible/.test(m.note||'')));
    if(!handled)out.push({m:s,p:prod(s.pid),kind:/rebut/i.test(s.note)?'rebut':'restock',q:+((s.note.match(/×(\d+)/)||[])[1]||0)});
  });
  return out.filter(x=>x.p).sort((a,b)=>ord(b.m,a.m));
}
/* ---- annulation (article 10) : plus de 72 h avant la livraison = remboursement total, sinon 50 % de la commande ---- */
const CANCEL_HOURS=72,CANCEL_KEEP=50;
const hoursBefore=r=>{const m=/^(\d+)h/.exec(r.delivSlot||''),hh=m?m[1].padStart(2,'0'):'07';return (new Date(r.start+'T'+hh+':00:00')-new Date())/36e5};
const refundSuggest=r=>{const h=hoursBefore(r),full=h>CANCEL_HOURS,p=Math.max(0,paid(r));return {hours:h,full,loc:full?p:Math.round(p*(100-CANCEL_KEEP)/100),caut:Math.max(0,cautionPaid(r))}};
const payLabel=p=>p.refund?(p.kind==='caution'?'Remboursement caution':'Remboursement annulation'):p.kind==='caution'?'Caution':'Location';

/* conflits de stock : articles engagés au-delà de leurs pièces utilisables (ex. factures importées, stock saisi trop bas) */
function stockConflicts(){
  const act=S.rentals.filter(r=>r.status==='Confirmée'||r.status==='Sortie'||holdActive(r));
  const pids=new Set();act.forEach(r=>r.lines.forEach(l=>pids.add(l.pid)));
  const lim=addD(TODAY,180),out={};
  pids.forEach(pid=>{
    const p=prod(pid);if(!p)return;
    const days=new Set([TODAY]);act.forEach(r=>{if(r.start>TODAY&&r.start<=lim&&r.lines.some(l=>l.pid===pid))days.add(r.start)});
    let peak=0,at=TODAY;days.forEach(d=>{const q=reserved(pid,d,d);if(q>peak){peak=q;at=d}});
    if(peak>usable(p))out[pid]={p,peak,at,usable:usable(p)};
  });
  return out;
}

/* rapports : mois sélectionné et détail d'une famille */
const monthLabel=k=>new Date(k+'-01T12:00:00').toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
function famDetail(cat){
  const per=ui.period,from=ui.rmonth?ui.rmonth+'-01':per==='all'?'0000-01-01':addD(TODAY,-parseInt(per,10)),to=ui.rmonth?ui.rmonth+'-31':'9999-12-31';
  const rs=S.rentals.filter(r=>live(r)&&r.start>=from&&(ui.rmonth?r.start<=to:r.start<=TODAY));
  const arts={},ords=[];
  rs.forEach(r=>{let sum=0;r.lines.forEach(l=>{const p=prod(l.pid);if(!p||p.cat!==cat)return;const v=l.qty*l.price*nDays(r);sum+=v;const a=arts[p.id]||(arts[p.id]={p,q:0,v:0});a.q+=l.qty*nDays(r);a.v+=v});if(sum)ords.push({r,sum})});
  const A=Object.values(arts).sort((a,b)=>b.v-a.v),tot=A.reduce((a,x)=>a+x.v,0);

/* articles dormants : aucune location (terminée ou à venir) depuis N jours */
function dormantList(days,cat){
  const first=S.rentals.filter(live).reduce((m,r)=>!m||r.start<m?r.start:m,'');
  const last={},fut={};
  S.rentals.filter(live).forEach(r=>r.lines.forEach(l=>{if(r.end>TODAY)fut[l.pid]=true;else if(!last[l.pid]||r.end>last[l.pid])last[l.pid]=r.end}));
  const lim=addD(TODAY,-days);
  const rows=S.products.filter(p=>(cat==='Tous'||p.cat===cat)&&!fut[p.id]&&(!last[p.id]||last[p.id]<lim)).map(p=>({p,last:last[p.id]||'',since:last[p.id]?diff(last[p.id],TODAY):null,val:p.stock*(p.cost||0)}));
  rows.sort((a,b)=>(b.val-a.val)||a.p.name.localeCompare(b.p.name));
  return {rows,first};
}

/* Conditions propres à un client (fiche client : remise et transport), ex. Salle Prestige */
const termsOf=cid=>{const c=client(cid);return c&&c.terms&&(c.terms.discount||c.terms.transport)?c.terms:null};
const termsPct=(T,sub)=>{let p=0;(T.discount||[]).forEach(t=>{if(sub>=t.from)p=t.pct});return p};
function setTransport(d){
  const T=termsOf(d.clientId);
  if(!d.commune)return;
  const z=d.zone==='Autre'?'':d.zone;
  d.delivery=(T&&T.transport&&T.transport[d.commune]!=null)?T.transport[d.commune]:tpPrice(d.commune,z);
}
function setDiscount(d){
  const T=termsOf(d.clientId);
  if(T&&T.discount&&!d.termsOff){const nd=Math.max(1,diff(d.start,d.end)+1),sub=d.lines.reduce((a,l)=>a+l.qty*lp(l),0)*nd;d.discPct=termsPct(T,sub);d.discount=Math.round(sub*d.discPct/100);d.autoDisc=true}
}
function onClientPick(d){
  const T=termsOf(d.clientId);
  if(d.autoDisc&&!T){d.discount=0;d.discPct=0;d.autoDisc=false;d.termsOff=false}
  if(d.communeAuto&&!T){d.commune='';d.zone='';d.delivery=0;d.communeAuto=false}
  if(T){d.termsOff=false;if(T.commune){d.commune=T.commune;d.zone='';d.communeAuto=true}}
  if(d.commune)setTransport(d);
  setDiscount(d);

  renderSide();
  $('#title').textContent=TITLES[ui.view];
  const V={dash:vDash,rentals:vRentals,pos:vPos,stock:vStock,cash:vCash,deposits:vDeposits,moves:vMoves,rebut:vRebut,care:vCare,clients:vClients,suppliers:vSuppliers,reports:vReports,team:vTeam,settings:vSettings,support:vSupport};
  $('#view').innerHTML=V[ui.view]();
  $('#plist').innerHTML=S.products.map(p=>`<option value="${esc(p.name)}">`).join('');
  if(ui.view==='pos')drawPos();
}

function toggleTheme(){const d=document.documentElement,n=d.getAttribute('data-theme')==='dark'?'light':'dark';d.setAttribute('data-theme',n);try{localStorage.setItem('tuskiq-theme',n)}catch(e){}}
try{const t=localStorage.getItem('tuskiq-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}

/* ============ graphiques ============ */
function barChart(data,cur){
  const W=560,H=210,pl=10,pb=28,pt=22,max=Math.max(1,...data.map(d=>d.value)),bw=(W-pl*2)/data.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Chiffre d’affaires par mois"><line class="axis" x1="${pl}" x2="${W-pl}" y1="${H-pb}" y2="${H-pb}"/>`;
  const clk=arguments.length>2,sel=arguments[2];data.forEach((d,i)=>{const h=Math.round((H-pb-pt)*d.value/max),x=pl+i*bw+bw*0.18,w=bw*0.64,y=H-pb-h,at=clk?` data-act="rmonth" data-v="${d.k}" style="cursor:pointer"`:'';
    s+=`<g${at}${clk&&sel&&sel!==d.k?' opacity=".4"':''}><rect class="hit" x="${x-bw*0.18+2}" y="${pt-6}" width="${bw-4}" height="${H-pb-pt+6}" rx="5" fill="transparent" style="fill:transparent"/><rect class="bar ${d.cur?'cur':''} ${clk&&sel===d.k?'sel':''}" x="${x}" y="${y}" width="${w}" height="${Math.max(h,d.value?2:0)}" rx="5"/><text class="val" x="${x+w/2}" y="${y-6}" text-anchor="middle">${d.value?fmtK(d.value):'—'}</text><text x="${x+w/2}" y="${H-9}" text-anchor="middle"${clk&&sel===d.k?' style="font-weight:800;fill:var(--ink)"':''}>${esc(d.label)}</text></g>`});
  return s+'</svg>';
}
function monthly(n){
  const out=[];const base=new Date(TODAY+'T12:00:00');
  for(let i=n-1;i>=0;i--){const d=new Date(base.getFullYear(),base.getMonth()-i,1,12);const k=iso(d).slice(0,7);
    out.push({k,label:d.toLocaleDateString('fr-FR',{month:'short'}).replace('.',''),cur:i===0,value:S.rentals.filter(r=>live(r)&&r.start.slice(0,7)===k).reduce((a,r)=>a+total(r),0)})}
  return out;
}
function hbars(rows,fmt){
  const max=Math.max(1,...rows.map(r=>r.v));
  return rows.length?rows.map(r=>`<div class="hb${r.d?' click':''}"${r.d?` data-act="${r.d[0]}" data-id="${esc(r.d[1])}" title="Voir le détail"`:''}><span title="${esc(r.l)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.l)}</span><span class="t"><i style="width:${Math.max(2,r.v/max*100)}%;${r.c?`background:${r.c}`:''}"></i></span><b class="num">${fmt(r.v)}</b></div>`).join(''):empty('Pas encore de données');
}

/* ============ tableau de bord ============ */
function vDash(){
  const mk=TODAY.slice(0,7),vr=S.rentals.filter(live);
  const money=can('money');
  const ca=vr.filter(r=>r.start.slice(0,7)===mk).reduce((a,r)=>a+total(r),0);
  const cashToday=S.rentals.flatMap(r=>r.payments).filter(p=>p.date===TODAY).reduce((a,p)=>a+p.amount,0);
  const open=vr.reduce((a,r)=>a+Math.max(0,balance(r)),0);
  const heldDep=S.rentals.filter(r=>r.deposit&&!r.depositClosedOn&&r.status!=='Annulée'&&r.status!=='Expirée').reduce((a,r)=>a+Math.max(0,cautionPaid(r)-(r.depositRetained||0)),0);
  const low=S.products.filter(p=>avail(p,TODAY,TODAY)<=p.min);
  const late=S.rentals.filter(overdue);
  const toPrep=S.rentals.filter(r=>r.status==='Confirmée'&&(!r.prepared||needsRecheck(r))&&delivDay(r)<=addD(TODAY,3));
  const toDeliver=S.rentals.filter(r=>r.status==='Confirmée'&&r.prepared&&!needsRecheck(r));
  const toReturn=S.rentals.filter(r=>r.status==='Sortie');
  const inMaint=S.products.reduce((a,p)=>a+(p.maint||0)+(p.dmg||0),0);
  const holds=S.rentals.filter(holdActive);
  const todo=[];
  const T=(roles,o)=>{if(roles.includes(me().role))todo.push(o)};
  Object.values(stockConflicts()).sort((a,b)=>(b.peak-b.usable)-(a.peak-a.usable)).slice(0,8).forEach(x=>T(['admin','commercial','stock'],{k:'p',id:x.p.id,c:'b-bad',i:'alert',t:'Stock insuffisant : '+x.p.name,s:x.peak+' pièces engagées pour '+x.usable+' utilisables (le '+fd(x.at)+') — recomptez le stock ou corrigez la commande'}));
  late.forEach(r=>T(['admin','commercial','driver','maint','stock'],{k:'r',id:r.id,c:'b-bad',i:'alert',t:'Non restitué : '+r.eventName,s:(client(r.clientId)||{}).name+' — retour prévu le '+fd(r.end)+(r.regul?' · en régularisation':'')}));
  holds.forEach(r=>T(['admin','commercial'],{k:'r',id:r.id,c:'b-warn',i:'alert',t:'Pré-réservation à confirmer : '+r.eventName,s:'Expire dans '+holdLeft(r)+' · paiement total à encaisser'}));
  S.rentals.filter(r=>r.status==='Devis').forEach(r=>T(['admin','commercial'],{k:'r',id:r.id,c:'b-info',i:'list',t:(r.source==='Plateforme (demande en ligne)'?'Demande en ligne à traiter : ':'Devis à traiter : ')+r.eventName,s:(client(r.clientId)||{}).name+' — événement le '+fd(r.start)}));
  toPrep.forEach(r=>T(['admin','stock'],{k:'r',id:r.id,c:'b-info',i:'box',t:'À préparer : '+r.eventName,s:'Livraison le '+fd(delivDay(r))+' · événement le '+fd(r.start)+' · '+r.lines.reduce((a,l)=>a+l.qty,0)+' pièces'}));
  toDeliver.forEach(r=>T(['admin','stock','driver'],{k:'r',id:r.id,c:'b-plum',i:'truck',t:'À livrer : '+r.eventName,s:'Préparée · livraison le '+fd(delivDay(r))+' · événement le '+fd(r.start)}));
  S.rentals.filter(r=>r.status==='Confirmée'&&r.start<=addD(TODAY,7)&&balance(r)>0).forEach(r=>T(['admin','commercial'],{k:'r',id:r.id,c:'b-warn',i:'wallet',t:'Solde à encaisser : '+F(balance(r)),s:r.eventName+' — '+fd(r.start)}));
  S.rentals.filter(r=>r.status==='Confirmée'&&r.deposit&&cautionPaid(r)<r.deposit&&r.start<=addD(TODAY,7)).forEach(r=>T(['admin','commercial'],{k:'r',id:r.id,c:'b-warn',i:'lock',t:'Caution à encaisser : '+F(r.deposit-cautionPaid(r)),s:r.eventName+' — '+fd(r.start)}));
  toReturn.filter(r=>!overdue(r)).forEach(r=>T(['admin','stock','maint','driver'],{k:'r',id:r.id,c:'b-warn',i:'swap',t:'Retour attendu : '+r.eventName,s:'Récupération le '+fd(pickDay(r))+' · fin de l’événement le '+fd(r.end)}));
  S.rentals.filter(r=>r.status==='Retournée'&&!r.settled).forEach(r=>T(['admin','commercial'],{k:'r',id:r.id,c:'b-warn',i:'wallet',t:'Retour à régler : '+r.eventName,s:'Casse, retard et caution à calculer'+(r.returnDate&&r.returnDate>r.end?' · '+diff(r.end,r.returnDate)+' j de retard':'')}));
  pendingAdvice().forEach(x=>T(['admin','commercial','stock'],{k:'p',id:x.p.id,c:'b-info',i:'alert',t:'Avis demandé : '+x.p.name,s:'Par '+staffName(x.m.by)+' · '+fdt(x.m.at||x.m.date)}));
  pendingProps().forEach(x=>T(['admin'],{k:'g',id:'rebut',c:'b-warn',i:'alert',t:'À valider : '+PROP_LABEL[x.d.kind].toLowerCase()+' · '+x.p.name,s:'Proposé par '+staffName(x.m.by)+' · '+fdt(x.m.at||x.m.date)}));
  pendingSignals().forEach(x=>T(['admin','stock'],{k:'p',id:x.p.id,c:x.kind==='rebut'?'b-bad':'b-info',i:'box',t:(x.kind==='rebut'?'À mettre au rebut : ':'À remettre en stock : ')+x.p.name,s:'Signalé par '+staffName(x.m.by)+' · '+fdt(x.m.at||x.m.date)}));
  S.rentals.filter(r=>r.status==='Retournée'&&r.settled&&r.deposit&&!r.depositClosedOn).forEach(r=>T(['admin','commercial','accountant'],{k:'r',id:r.id,c:'b-info',i:'lock',t:'Caution à clôturer : '+F(r.deposit-(r.depositRetained||0))+' à restituer',s:r.eventName+' · '+r.depositState}));
  low.slice(0,4).forEach(p=>T(['admin','stock'],{k:'p',id:p.id,c:'b-warn',i:'box',t:'Stock bas : '+p.name,s:'Disponible aujourd’hui : '+avail(p,TODAY,TODAY)+' (seuil '+p.min+')'}));
  const cats={};vr.forEach(r=>r.lines.forEach(l=>{const p=prod(l.pid);if(p)cats[p.cat]=(cats[p.cat]||0)+l.qty*l.price*nDays(r)}));
  const kp=money?[
    ['Chiffre d’affaires du mois',F(ca),vr.filter(r=>r.start.slice(0,7)===mk).length+' commandes'],
    ['Encaissé aujourd’hui',F(cashToday),'avances, soldes et cautions'],
    ['Reste à encaisser',F(open),'sur les commandes confirmées'],
    ['Cautions détenues',F(heldDep),'à restituer ou retenir']
  ]:[
    ['À préparer',String(toPrep.length),'commandes confirmées'],
    ['À livrer',String(toDeliver.length),'préparées, prêtes'],
    ['Chez les clients',String(toReturn.length),late.length?late.length+' en retard':'aucun retard'],
    ['En entretien / endommagés',String(inMaint),'pièces indisponibles']
  ];
  return `<p class="hello">Bonjour ${esc(me().name.split(' ')[0])} — ${esc(ROLES[me().role])}. Nous sommes le ${esc(new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}))}.</p>
  <div class="kpis">${kp.map(k=>`<div class="kpi"><span>${k[0]}</span><b>${k[1]}</b><small>${k[2]}</small></div>`).join('')}</div>
  <div class="cols">
    <div class="stack">
      <section class="panel"><div class="panel-h"><h3>Les 14 prochains jours</h3><small>Cliquez sur une commande pour l’ouvrir</small></div><div class="scroll">${timeline()}</div></section>
      ${money?`<section class="panel chart"><div class="panel-h"><h3>Chiffre d’affaires par mois</h3><small>6 derniers mois</small></div>${barChart(monthly(6))}</section>
      <section class="panel"><div class="panel-h"><h3>Ce qui rapporte, par famille de produits</h3><small>commandes confirmées</small></div>${hbars(Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([l,v])=>({l,v,c:CATCOL[l]})),F)}</section>`:''}
    </div>
    <section class="panel"><div class="panel-h"><h3>À traiter par votre rôle</h3><small>${todo.length} action${todo.length>1?'s':''}</small></div>
    ${todo.length?`<ul class="todo">${todo.map(t=>`<li data-act="${t.k==='r'?'openRental':t.k==='g'?'go':'openProduct'}" data-id="${t.id}" data-v="${t.id}"><span class="dot ${t.c}">${ic(t.i,16)}</span><span><b>${esc(t.t)}</b><small>${esc(t.s)}</small></span></li>`).join('')}</ul>`:empty('Tout est à jour','Aucune action pour votre rôle pour le moment.')}</section>
  </div>`;
}
function timeline(){
  const dys=Array.from({length:14},(_,i)=>addD(TODAY,i));
  const rows=S.rentals.filter(r=>(live(r)&&r.status!=='Retournée'||r.status==='Devis'||holdActive(r))&&r.end>=dys[0]&&r.start<=dys[13]).sort((a,b)=>a.start.localeCompare(b.start)).slice(0,10);
  if(!rows.length)return empty('Aucune commande dans les 14 prochains jours','Créez une commande pour la voir apparaître ici.');
  let h='<div class="tl">'+`<div></div>`+dys.map(d=>{const dt=new Date(d+'T12:00:00');return `<div class="tl-h ${d===TODAY?'today':''}">${dt.toLocaleDateString('fr-FR',{weekday:'narrow'})}<i>${dt.getDate()}</i></div>`}).join('');
  rows.forEach((r,i)=>{
    const row=i+2,s=Math.max(0,diff(dys[0],r.start)),e=Math.min(13,diff(dys[0],r.end));
    h+=`<div class="tl-l" style="grid-row:${row};grid-column:1" data-act="openRental" data-id="${r.id}">${esc(r.eventName)}</div>`;
    dys.forEach((d,j)=>{const we=[0,6].includes(new Date(d+'T12:00:00').getDay());h+=`<div class="tl-c ${we?'we':''} ${d===TODAY?'today':''}" style="grid-row:${row};grid-column:${j+2}"></div>`});
    const cls=r.status==='Sortie'?'s-out':r.status==='Devis'?'s-dev':r.status==='Pré-réservation'?'s-hold':'s-conf';
    h+=`<button class="tl-b ${cls}" style="grid-row:${row};grid-column:${s+2}/${e+3}" data-act="openRental" data-id="${r.id}" title="${esc(r.eventName)} — ${esc(sl(r.status))}">${e-s>=1?esc((client(r.clientId)||{}).name||''):''}</button>`;
  });
  return h+'</div>';
}

/* ============ commandes (liste) ============ */
const isOnline=r=>r.source==='Plateforme (demande en ligne)';
function rentalRows(){
  const q=ui.rq.toLowerCase(),sr=ui.rsrc||'all';
  return S.rentals.filter(r=>(ui.rstat==='all'||r.status===ui.rstat)&&(sr==='all'||(sr==='online'?isOnline(r):!isOnline(r)))&&(!q||(r.eventName+' '+r.no+' '+(r.quoteNo||'')+' '+((client(r.clientId)||{}).name||'')).toLowerCase().includes(q))).sort((a,b)=>b.start.localeCompare(a.start));
}
function vRentals(){
  const q=ui.rq.toLowerCase();
  const st=['all',...STATUSES];
  const cnt=s=>s==='all'?S.rentals.length:S.rentals.filter(r=>r.status===s).length;
  const rows=rentalRows();
  const nOn=S.rentals.filter(isOnline).length,nNew=S.rentals.filter(r=>isOnline(r)&&r.status==='Devis').length;
  return `<div class="bar-row"><div class="search">${ic('search',16)}<input id="rq" type="search" placeholder="Rechercher un client, un événement, un n°" value="${esc(ui.rq)}" data-in="rq" aria-label="Rechercher une commande"></div>
   <div class="chips">${st.map(s=>`<button class="chip ${ui.rstat===s?'on':''}" data-act="rstat" data-v="${s}">${s==='all'?'Toutes':esc(sl(s))}<small>${cnt(s)}</small></button>`).join('')}</div>
   <div class="chips" aria-label="Origine">${[['all','Toutes origines',S.rentals.length],['online','🌐 En ligne',nOn],['team','Équipe',S.rentals.length-nOn]].map(([k,l,n])=>`<button class="chip ${(ui.rsrc||'all')===k?'on':''}" data-act="rsrc" data-v="${k}">${l}<small>${n}</small></button>`).join('')}${nNew?`<span class="badge b-info" title="Demandes en ligne en attente de traitement">${nNew} à traiter</span>`:''}</div>
   <span class="grow"></span>${can('rent')?`<button class="btn primary" data-act="go" data-v="pos">${ic('plus',16)} Nouvelle commande</button>`:''}</div>
  <section class="panel" style="padding:6px 8px"><div class="scroll" id="rtable">${rentalsTable(rows)}</div></section>`;
}
function rentalsTable(rows){
  if(!rows.length)return empty('Aucune commande trouvée','Changez le filtre ou créez une nouvelle commande.');
  const m=can('money');
  return `<table><thead><tr><th>N°</th><th>Événement</th><th>Dates</th>${m?'<th class="num">Total</th><th class="num">Reste à payer</th>':''}<th>Statut</th></tr></thead><tbody>${rows.map(r=>`<tr data-act="openRental" data-id="${r.id}"><td>${esc(r.no)}${r.quoteNo?`<span class="sub">devis ${esc(r.quoteNo)}</span>`:''}</td><td><b>${esc(r.eventName)}</b>${isOnline(r)?' <span class="badge b-info">🌐 En ligne</span>':''}<span class="sub">${esc((client(r.clientId)||{}).name||'—')}</span></td><td>${fd(r.start)}${r.end!==r.start?' → '+fd(r.end):''}${delivDay(r)!==r.start||pickDay(r)!==r.end?`<span class="sub">Livraison ${fd(delivDay(r))} · Récup. ${fd(pickDay(r))}</span>`:''}</td>${m?`<td class="num">${F(total(r))}</td><td class="num ${balance(r)>0&&live(r)?'neg':''}">${!live(r)?'—':balance(r)>0?F(balance(r)):'Soldé'}</td>`:''}<td>${badge(r.status)}${overdue(r)?' <span class="badge b-bad">Non restitué</span>':''}${r.status==='Pré-réservation'?`<span class="sub">expire dans ${holdLeft(r)}</span>`:''}</td></tr>`).join('')}</tbody></table>`;
}

/* ============ détail d'une commande ============ */
function stepsHtml(r){
  const e=[];
  e.push(['Créée',r.created,staffName(r.by)]);
  if(r.holdUntil)e.push([r.status==='Expirée'?'Pré-réservation expirée':'Pré-réservation jusqu’à',r.holdUntil,'']);
  const adv=r.payments.find(p=>p.kind!=='caution');
  if(adv&&live(r))e.push(['Paiement enregistré',adv.at||adv.date,staffName(adv.by)]);
  (r.addons||[]).forEach((a,i)=>e.push([(a.post?'Articles constatés après la récupération':'Articles ajoutés')+' · facture complémentaire n° '+(i+1)+' (même n° de facture)',a.at,staffName(a.by)]));
  ((r.edits&&r.edits.length)?r.edits:(r.editedAt?[{at:r.editedAt,by:null,note:r.editNote||''}]:[])).forEach(x=>e.push(['Commande modifiée : '+x.note,x.at,x.by?staffName(x.by):'']));
  if(r.prepared)e.push(['Préparée et vérifiée',r.preparedAt,staffName(r.preparedBy)]);
  if(r.outAt)e.push(['Livrée (sortie du stock)',r.outAt,staffName(r.outBy)]);
  if(r.exceptionNote)e.push(['Dérogation de paiement : '+r.exceptionNote,r.exceptionAt,staffName(r.exceptionBy)]);
  if(r.returnedAt)e.push(['Retour reçu (comptage et état)'+(r.returnDate?' · rapporté le '+fd(r.returnDate,1):''),r.returnedAt,staffName(r.returnedBy)]);
  if(r.settledAt)e.push(['Retour réglé (casse, retard, caution)',r.settledAt,staffName(r.settledBy)]);
  if(r.depositClosedOn)e.push(['Caution clôturée',r.depositClosedOn,'']);
  return `<ul class="steps">${e.map(x=>`<li><b>${esc(x[0])}</b><span>${x[1]?fdt(x[1]):''}${x[2]?' · '+esc(x[2]):''}</span></li>`).join('')}</ul>`;
}
function showRental(id){
  const r=S.rentals.find(x=>x.id===id);if(!r)return;
  const c=client(r.clientId)||{},nd=nDays(r),m=can('money');
  const lines=r.lines.map(l=>{const p=prod(l.pid)||{name:'?'};const k=r.lost[l.pid]?` <span class="badge b-bad">${r.lost[l.pid]} manquant(s)</span>`:'';return `<tr><td>${esc(p.name)}${k}</td><td class="num">${l.qty}</td>${m?`<td class="num">${F(l.price)}</td><td class="num">${F(l.qty*l.price*nd)}</td>`:''}</tr>`}).join('');

  const inc=r.incidents.length?`<h3 style="margin:16px 0 6px">Pertes et casses signalées</h3><div class="scroll"><table><tbody>${r.incidents.map(x=>`<tr><td>${fdt(x.at)}</td><td>${esc(x.type)}</td><td>${esc((prod(x.pid)||{}).name)}</td><td class="num">${x.qty}</td><td>${esc(staffName(x.by))}</td></tr>`).join('')}</tbody></table></div>`:'';
  const dep=r.deposit?`<div class="kv" style="margin-top:14px"><div><span>Caution (${S.settings.depositRate} %)</span><b>${F(r.deposit)}</b><span>${depBadge(r)}</span></div><div><span>Encaissée</span><b>${F(cautionPaid(r))}</b></div>${r.status==='Retournée'?`<div><span>Retenue</span><b class="${r.depositRetained?'neg':''}">${F(r.depositRetained||0)}</b></div><div><span>Reliquat à restituer au client</span><b>${F(Math.max(0,cautionPaid(r)-(r.depositRetained||0)))}</b></div>${r.settled&&r.fees>0?`<div><span>Complément à payer par le client (dommages au-delà de la caution)</span><b class="neg">${F(r.fees)}</b><span>${balance(r)>0?'<span class="badge b-warn">À encaisser : '+F(balance(r))+'</span>':'<span class="badge b-ok">Payé</span>'}</span></div>`:''}${r.settled&&r.lateFee?`<div><span>Retard de restitution</span><b>${r.lateDays} j · ${F(r.lateFee)}</b></div>`:''}`:''}</div>`:'';

   ${warn}
   ${needsRecheck(r)?`<div class="warn-box">Commande modifiée après préparation (${esc(r.editNote||'')}) : l’entrepôt doit revérifier le matériel avant la livraison.</div>`:''}
   <div class="scroll"><table><thead><tr><th>Article</th><th class="num">Qté</th>${m?'<th class="num">Prix/jour</th><th class="num">Total</th>':''}</tr></thead><tbody>${lines}</tbody></table></div>
   ${m?`<div class="tot"><div><span>Location (${nd} j)</span><span>${F(subtotal(r))}</span></div><div><span>Livraison & récupération</span><span>${F(r.delivery||0)}</span></div>${postExtra(r)?`<div><span>Articles constatés après la récupération (factures complémentaires)</span><span>${F(postExtra(r))}</span></div>`:''}${r.fees?`<div><span>Frais de casse / perte (au-delà de la caution)</span><span>${F(r.fees)}</span></div>`:''}${r.discount?`<div><span>Remise</span><span>− ${F(r.discount)}</span></div>`:''}<div class="big"><span>Total</span><span>${F(total(r))}</span></div><div><span>Payé</span><span class="pos">${F(paid(r))}</span></div><div><b>Reste à payer</b><b class="${balance(r)>0?'neg':''}">${F(balance(r))}</b></div></div>${dep}${(live(r)||r.signedOn)?signBox(r):''}
   <h3 style="margin:18px 0 6px">Paiements</h3><div class="scroll"><table><thead><tr><th>Date et heure</th><th>Nature</th><th>Moyen</th><th class="num">Montant</th><th>Enregistré par</th></tr></thead><tbody>${pays}</tbody></table></div>`:''}
   ${inc}
   <h3 style="margin:18px 0 6px">Suivi</h3>${stepsHtml(r)}

}

/* ---- transitions ---- */
function checkAvail(lines,s,e,ex){
  const bad=[];lines.forEach(l=>{const p=prod(l.pid);const a=avail(p,s,e,ex);if(l.qty>a)bad.push(`${p.name} (demandé ${l.qty}, disponible ${Math.max(0,a)})`)});return bad;
}
function holdForm(id){
  const r=S.rentals.find(x=>x.id===id),mx=S.settings.holdMaxHours;
  formModal({title:'Pré-réserver : '+r.eventName,narrow:true,fields:[
    {k:'h',label:'Durée du blocage',type:'select',full:true,value:'1',options:Array.from({length:mx},(_,i)=>[String(i+1),(i+1)+' heure'+(i?'s':'')]),hint:'Les articles sont bloqués pour ce client et non proposés aux autres. Au-delà, la commande expire seule. La commande n’est confirmée qu’avec le paiement total.'}],
   submit:'Bloquer le stock',onSubmit:v=>{
    {const sp=slotProblem(delivDay(r),r.delivSlot,pickDay(r),r.pickSlot,r.id);if(sp){toast(sp,1);return false}}
    const bad=checkAvail(r.lines,delivDay(r),pickDay(r),r.id);if(bad.length){toast('Disponibilité insuffisante : '+bad[0],1);return false}
    r.status='Pré-réservation';r.holdUntil=new Date(Date.now()+Math.min(mx,num(v.h))*36e5).toISOString();r.holdBy=S.me;save();toast('Stock bloqué pendant '+v.h+' h.');setTimeout(()=>{render();showRental(id)},0);
   }});
}
function advanceForm(id){
  const r=S.rentals.find(x=>x.id===id),dep=depositFor(r),due=Math.max(0,total(r)-paid(r)),dueC=Math.max(0,dep-cautionPaid(r));
  const so=SLOTS.map(x=>[x,x]),sD=SLOTS.map(x=>[x,x+(slotUser(delivDay(r),x,r.id)?' — déjà réservé':'')]),sP=SLOTS.map(x=>[x,x+(slotUser(pickDay(r),x,r.id)?' — déjà réservé':'')]);
  formModal({title:'Paiement total et confirmation : '+r.eventName,narrow:true,fields:[
    {k:'amount',label:'Articles + transport reçus (F)',type:'number',min:0,required:true,full:true,value:due,hint:'Montant exact : '+F(due)+' (articles '+F(subtotal(r))+' + transport '+F(r.delivery||0)+(r.discount?' − remise '+F(r.discount):'')+'). Pas d’avance : la réservation du matériel et des créneaux exige le paiement total.'},
    {k:'caut',label:'Caution reçue (F)',type:'number',min:0,value:dueC,full:true,hint:'Caution : '+F(dep)+' ('+S.settings.depositRate+' % des articles après remise, transport exclu).'},
    {k:'method',label:'Moyen de paiement',type:'select',options:PAY,full:true},
    {k:'ds',label:'Créneau de livraison (le '+fd(delivDay(r),1)+')',type:'select',options:[['','— À choisir —'],...sD],value:r.delivSlot||'',full:true},
    {k:'ps',label:'Créneau de récupération (le '+fd(pickDay(r),1)+')',type:'select',options:[['','— À choisir —'],...sP],value:r.pickSlot||'',full:true}],
   submit:'Confirmer la réservation',onSubmit:v=>{
    if(!v.ds||!v.ps){toast('Choisissez le créneau de livraison et le créneau de récupération.',1);return false}
    {const sp=slotProblem(delivDay(r),v.ds,pickDay(r),v.ps,r.id);if(sp){toast(sp,1);return false}}
    if(v.amount<due||v.caut<dueC){toast('Paiement total exigé : il reste '+F(due+dueC)+' à encaisser (articles, transport et caution). Pas d’avance.',1);return false}
    if(r.status==='Devis'||r.status==='Expirée'){const bad=checkAvail(r.lines,delivDay(r),pickDay(r),r.id);if(bad.length){toast('Stock insuffisant : '+bad[0],1);return false}}
    const t=nowLocal();
    if(v.amount>0)r.payments.push({id:uid('y'),date:TODAY,at:t,amount:Math.round(v.amount),method:v.method,by:S.me,kind:'location'});
    r.deposit=dep;
    if(v.caut>0)r.payments.push({id:uid('y'),date:TODAY,at:t,amount:Math.round(v.caut),method:v.method,by:S.me,kind:'caution'});
    r.delivSlot=v.ds;r.pickSlot=v.ps;
    r.status='Confirmée';r.holdUntil=null;giveInvoice(r);save();toast('Réservation confirmée : matériel et créneaux réservés.');setTimeout(()=>{render();showRental(id)},0);
   }});
}
function prepForm(id){
  const r=S.rentals.find(x=>x.id===id);
  const rows=r.lines.map((l,i)=>{const p=prod(l.pid);return `<tr><td>${esc(p.name)}</td><td class="num">${l.qty}</td><td class="num"><label class="chk"><input type="checkbox" name="ok_${i}" aria-label="Vérifié : ${esc(p.name)}"> fonctionnel, propre, complet</label></td></tr>`}).join('');
  openModal('Préparation : '+r.eventName,`<p class="hint" style="margin-top:0">Vérifiez chaque article avant livraison. Un article défectueux se signale depuis « Catalogue & stock » (il est alors exclu des disponibilités) ; remplacez-le avant de valider.</p><form id="pform"><div class="scroll"><table><thead><tr><th>Article</th><th class="num">Qté à fournir</th><th class="num">Contrôle</th></tr></thead><tbody>${rows}</tbody></table></div><div class="modal-foot" style="display:flex;justify-content:flex-end;gap:10px;margin-top:14px"><button type="button" class="btn ghost" data-act="closeModal">Annuler</button><button class="btn primary" type="submit">Valider la préparation</button></div></form>`,{focus:false});
  $('#pform').addEventListener('submit',e=>{
    e.preventDefault();const d=new FormData(e.target);
    if(r.lines.some((l,i)=>!d.get('ok_'+i))){toast('Cochez chaque article vérifié avant de valider.',1);return}
    r.prepared=true;r.preparedAt=nowLocal();r.preparedBy=S.me;save();closeModal();render();toast('Préparation validée. Matériel transmis au livreur.');showRental(id);
  });
}
function deliver(id){
  const r=S.rentals.find(x=>x.id===id);
  if(r.status!=='Confirmée'){toast('Aucun article ne peut être livré sans réservation confirmée.',1);return}
  if(!r.prepared){toast('Le matériel n’est pas encore préparé.',1);return}
  if(needsRecheck(r)){toast('La commande a été modifiée après la préparation : l’entrepôt doit revérifier le matériel.',1);return}
  const shF=r.moneyHidden?(r.fullyPaid?0:1):Math.max(0,balance(r)),shC=r.moneyHidden?0:Math.max(0,(r.deposit||0)-cautionPaid(r));
  if(shF>0||shC>0){toast(can('money')?'Paiement total exigé avant la livraison (articles, transport et caution) : '+F(shF+shC)+' restent à encaisser.':'Livraison bloquée : la commande n’est pas payée en totalité.',1);return}
  if(delivDay(r)>addD(TODAY,1)){toast('La livraison n’est possible que la veille ou le jour prévu de livraison ('+fd(delivDay(r),1)+').',1);return}
  const bad=r.lines.filter(l=>l.qty>usable(prod(l.pid)));if(bad.length){toast('Article indisponible (entretien ou endommagé) : '+prod(bad[0].pid).name,1);return}
  confirmDialog('Valider la livraison ?','La date et l’heure de sortie seront enregistrées à votre nom et les articles passeront à « Loué ».','Valider la livraison',()=>{
    r.status='Sortie';r.outAt=nowLocal();r.outBy=S.me;r.lines.forEach(l=>addMove(l.pid,'Sortie',-l.qty,r.no,'Livraison'));save();render();toast('Livraison validée.');showRental(id);
  });
}
function damageCost(r){return r.incidents.filter(x=>x.type==='Perte'||x.type==='Endommagé').reduce((a,x)=>a+x.qty*repl(prod(x.pid)||{price:0}),0)}
/* Volet 1 — réception du matériel : comptage et état, par le stock ou l’entretien (aucun montant) */
function showReturn(id){
  const r=S.rentals.find(x=>x.id===id);if(!r)return;
  const m=can('money');
  const rows=r.lines.map(l=>{const p=prod(l.pid);return `<tr><td>${esc(p.name)}${m?`<span class="sub">Remplacement : ${F(repl(p))} / pièce</span>`:''}</td><td class="num">${l.qty}</td>
   <td class="num"><input type="number" min="0" max="${l.qty}" value="0" name="lost_${l.pid}" style="width:70px;text-align:right" aria-label="Manquants : ${esc(p.name)}"></td>
   <td class="num"><input type="number" min="0" max="${l.qty}" value="0" name="dmg_${l.pid}" style="width:70px;text-align:right" aria-label="Endommagés : ${esc(p.name)}"></td>
   <td class="num"><input type="number" min="0" max="${l.qty}" value="0" name="mnt_${l.pid}" style="width:70px;text-align:right" aria-label="À nettoyer ou réparer : ${esc(p.name)}"></td><td><input type="text" name="cm_${l.pid}" placeholder="RAS" style="width:150px" aria-label="Commentaire : ${esc(p.name)}"></td></tr>`}).join('');
  const d0=r.returnDate||TODAY;
  openModal('Réception du retour',`<p class="hint" style="margin-top:0">${esc(r.eventName)} — indiquez seulement les écarts. Le reste retourne en stock disponible. Les pièces <b>endommagées</b> et <b>en entretien</b> sont exclues des disponibilités jusqu’à la remise en stock par le service stock. <b>Le commercial règle ensuite</b> les conséquences financières (casse, retard, caution).</p><form id="rform"><div class="scroll"><table><thead><tr><th>Article</th><th class="num">Sorti</th><th class="num">Manquants</th><th class="num">Endommagés</th><th class="num">À nettoyer ou réparer</th><th>Commentaire</th></tr></thead><tbody>${rows}</tbody></table></div>
   <div class="form" style="margin-top:14px"><div class="field"><label for="rdate">Date réelle de retour</label><input id="rdate" name="rdate" type="date" value="${d0}" max="${TODAY}" min="${r.start}"><div class="hint">Date à laquelle le client a rapporté le matériel (prévue : ${fd(r.end,1)}).${d0>r.end?` <b>Retard : ${diff(r.end,d0)} jour(s).</b>`:''}</div></div></div>
   <div class="modal-foot"><button type="button" class="btn ghost" data-act="closeModal">Annuler</button><button class="btn primary" type="submit">Valider la réception</button></div></form>`,{focus:false});
  $('#rform').addEventListener('submit',e=>{
    e.preventDefault();const d=new FormData(e.target);
    if(!can('ret')){toast('Droit insuffisant.',1);return}
    const rdate=String(d.get('rdate')||TODAY);
    if(rdate<r.start||rdate>TODAY){toast('Date de retour invalide.',1);return}
    const inc=[];
    for(const l of r.lines){
      const lost=Math.max(0,Math.round(num(d.get('lost_'+l.pid)))),dmg=Math.max(0,Math.round(num(d.get('dmg_'+l.pid)))),mnt=Math.max(0,Math.round(num(d.get('mnt_'+l.pid))));
      if(lost+dmg+mnt>l.qty){toast('« '+prod(l.pid).name+' » : les écarts dépassent la quantité sortie.',1);return}
      inc.push({l,lost,dmg,mnt,cm:String(d.get('cm_'+l.pid)||'').trim()});
    }
    inc.forEach(({l,lost,dmg,mnt,cm})=>{
      const p=prod(l.pid);
      addMove(l.pid,'Retour',l.qty-lost,r.no,'');
      if(lost){addMove(l.pid,'Perte',-lost,r.no,'Manquant au retour');p.stock=Math.max(0,p.stock-lost);r.lost[l.pid]=lost;r.incidents.push({type:'Perte',pid:l.pid,qty:lost,at:nowLocal(),by:S.me,note:'Manquant au retour'+(cm?' — '+cm:'')})}
      if(dmg){p.dmg=(p.dmg||0)+dmg;addMove(l.pid,'État',dmg,r.no,'Loué → Endommagé (casse au retour)');r.incidents.push({type:'Endommagé',pid:l.pid,qty:dmg,at:nowLocal(),by:S.me,note:'Casse ou dégradation constatée'+(cm?' — '+cm:'')})}
      if(mnt){p.maint=(p.maint||0)+mnt;addMove(l.pid,'État',mnt,r.no,'Loué → En entretien (nettoyage ou réparation)');r.incidents.push({type:'Entretien',pid:l.pid,qty:mnt,at:nowLocal(),by:S.me,note:'Nettoyage ou réparation'+(cm?' — '+cm:'')})}
    });
    inc.forEach(({l,lost,dmg,mnt,cm})=>{if(cm&&!lost&&!dmg&&!mnt)r.incidents.push({type:'Remarque',pid:l.pid,qty:0,at:nowLocal(),by:S.me,note:cm})});
    r.status='Retournée';r.returnedAt=nowLocal();r.returnedBy=S.me;r.returnDate=rdate;r.regul=false;r.settled=false;
    if(r.deposit)r.depositState='À restituer';
    save();closeModal();render();toast('Réception enregistrée. Le commercial peut maintenant régler le retour.');showRental(id);
  });
}

/* Volet 2 — règlement du retour : retard, casse, retenue sur la caution (commercial) */
function settleForm(id){
  const r=S.rentals.find(x=>x.id===id);if(!r)return;
  const cp=cautionPaid(r),D=damageCost(r),d0=r.returnDate||TODAY,ld=lateDaysOf(r,d0),L=Math.round(ld*dailyRate(r)),C=D+L,ret0=Math.min(cp,C);
  const lostTxt=r.incidents.filter(x=>x.type==='Perte'||x.type==='Endommagé').map(x=>`${x.qty} × ${esc((prod(x.pid)||{}).name)} (${x.type==='Perte'?'manquant':'endommagé'})`).join(', ')||'aucun écart constaté';
  openModal('Règlement du retour',`<p class="hint" style="margin-top:0">${esc(r.eventName)} — le stock a enregistré la réception. Constat : ${lostTxt}. Casse et pertes au prix de remplacement : <b>${F(D)}</b>.</p>
  <form id="sform" class="form" data-cp="${cp}" data-d="${D}" data-rate="${dailyRate(r)}" data-end="${r.end}">
   <div class="field"><label for="sdate">Date réelle de retour</label><input id="sdate" name="sdate" type="date" value="${d0}" min="${r.start}" max="${TODAY}" data-in="settle"><div class="hint">Prévue le ${fd(r.end,1)}. Tarif d’une journée supplémentaire : ${F(Math.round(dailyRate(r)))}.</div></div>
   <div class="field"><label for="slate">Location supplémentaire (retard) (F)</label><input id="slate" name="slate" type="number" min="0" value="${L}" data-in="settle2"><div class="hint" id="slh">${ld} jour(s) de retard</div></div>
   <div class="field"><label for="sret">Retenue sur la caution (F)</label><input id="sret" name="sret" type="number" min="0" value="${ret0}"><div class="hint">Caution encaissée : ${F(cp)}.</div></div>
   <div class="field"><label for="sfees">Complément à payer par le client (F)</label><input id="sfees" name="sfees" type="number" min="0" value="${Math.max(0,C-ret0)}"><div class="hint">Si les coûts (casse, pertes, retard) dépassent la caution, le client paie la différence : une facture complémentaire est éditée. Si la caution est supérieure, le reliquat lui est restitué.</div></div>
   <div class="modal-foot"><button type="button" class="btn ghost" data-act="closeModal">Annuler</button><button class="btn primary" type="submit">Valider le règlement</button></div></form>`,{focus:false});
  $('#sform').addEventListener('submit',e=>{
    e.preventDefault();const d=new FormData(e.target);
    if(!can('settle')){toast('Droit insuffisant.',1);return}
    const sd=String(d.get('sdate')||d0),late=Math.max(0,num(d.get('slate'))),ret=Math.max(0,num(d.get('sret'))),fees=Math.max(0,num(d.get('sfees')));
    if(sd<r.start||sd>TODAY){toast('Date de retour invalide.',1);return}
    if(ret>cp){toast('La retenue dépasse la caution encaissée ('+F(cp)+').',1);return}
    r.returnDate=sd;r.lateDays=lateDaysOf(r,sd);r.lateFee=Math.round(late);
    r.depositRetained=Math.round(ret);r.fees=Math.round(fees);
    if(r.deposit){r.depositState=ret<=0?'À restituer':ret>=cp?'Retenue':'Partiellement retenue';if(ret>=cp&&cp>0){r.depositClosedOn=TODAY;r.depositBack=0}}
    r.settled=true;r.settledAt=nowLocal();r.settledBy=S.me;
    save();closeModal();render();toast('Règlement enregistré.');showRental(id);
  });
}
function closeDep(id){
  const r=S.rentals.find(x=>x.id===id),back=cautionPaid(r)-(r.depositRetained||0);
  if(!r.settled){toast('Réglez d’abord le retour (casse, retard, retenue).',1);return}
  if(balance(r)>0){toast('Le client doit encore payer le complément : '+F(balance(r))+'.',1);return}
  confirmDialog('Clôturer la caution ?','Restituer '+F(back)+' au client (retenue : '+F(r.depositRetained||0)+'). Le dossier de caution sera clôturé.','Restituer et clôturer',()=>{
    r.depositClosedOn=TODAY;r.depositBack=back;if(r.depositState==='À restituer')r.depositState='Clôturée';save();render();toast('Caution clôturée.');showRental(id);
  });
}

/* ============ modifier une commande confirmée : ajout, retrait d’article, changement de quantité ============ */
function editLinesForm(id){
  const r=S.rentals.find(x=>x.id===id);if(!r||r.status!=='Confirmée'||!can('rent'))return;
  const ps=S.products.filter(p=>p.price>0&&usable(p)>0).sort((a,b)=>(a.cat+a.name).localeCompare(b.cat+b.name,'fr'));
  const opts=[['','— Aucun —'],...ps.map(p=>[p.id,p.cat+' · '+p.name+' ('+F(p.price)+')'])];
  const fields=r.lines.map((l,i)=>{const p=prod(l.pid)||{name:'?'};return {k:'q'+i,label:p.name+(l.pack?' (forfait avec table)':'')+' · '+F(l.price)+'/jour',type:'number',min:0,value:l.qty}});
  fields.push({k:'_h',label:'Ajouter des articles',type:'static',full:true,hint:'Choisissez jusqu’à 4 articles à ajouter.'});
  for(let i=1;i<=4;i++)fields.push({k:'p'+i,label:'Article ajouté '+i,type:'select',options:opts,full:true},{k:'n'+i,label:'Quantité',type:'number',min:1});
  fields.push({k:'method',label:'Moyen de remboursement (si le client a trop payé)',type:'select',options:PAY,full:true,hint:'Pour retirer un article, mettez sa quantité à 0. La remise en pourcentage et la caution (30 % des articles après remise) sont recalculées. Le transport ne change pas. Si le client a trop payé, le remboursement est enregistré dans la caisse.'});
  formModal({title:'Modifier la commande : '+r.eventName,narrow:true,fields:fields.filter(f=>f.type!=='static'),submit:'Enregistrer la modification',onSubmit:v=>{
    const before=r.lines.map(l=>({...l}));let lines=before.map((l,i)=>{const x=v['q'+i];const q=(x===''||x==null||isNaN(+x))?l.qty:Math.max(0,Math.round(+x));return {...l,qty:q}});
    const added=[];for(let i=1;i<=4;i++){const pid=v['p'+i],q=Math.round(+v['n'+i]);if(pid&&q>0){const e=added.find(x=>x.pid===pid);if(e)e.qty+=q;else added.push({pid,qty:q,price:prod(pid).price})}}
    added.forEach(a=>{const l=lines.find(x=>x.pid===a.pid&&!x.pack&&x.qty>0);if(l)l.qty+=a.qty;else lines.push({...a})});
    const notes=[],inc=[];
    before.forEach((l,i)=>{const to=lines[i].qty,nm=(prod(l.pid)||{name:'?'}).name;if(to>l.qty){notes.push(nm+' +'+(to-l.qty));inc.push({pid:l.pid,qty:to-l.qty,price:l.price})}else if(to===0&&l.qty>0)notes.push(nm+' retiré');else if(to<l.qty)notes.push(nm+' −'+(l.qty-to))});
    added.forEach(a=>{const l=before.find(x=>x.pid===a.pid&&!x.pack);if(l){const k=before.indexOf(l);if(!inc.some(z=>z.pid===a.pid)&&lines[k].qty>l.qty){}}else{notes.push((prod(a.pid)||{name:'?'}).name+' +'+a.qty+' (ajouté)');inc.push({pid:a.pid,qty:a.qty,price:a.price})}});
    lines=lines.filter(l=>l.qty>0);
    if(!notes.length){toast('Aucune modification à enregistrer.',1);return false}
    if(!lines.length){toast('La commande doit garder au moins un article. Pour tout retirer, annulez la commande.',1);return false}
    const up=lines.filter(l=>{const o=before.find(x=>x.pid===l.pid&&!!x.pack===!!l.pack);return !o||l.qty>o.qty});
    const bad=checkAvail(up,delivDay(r),pickDay(r),r.id);if(bad.length){toast('Stock insuffisant : '+bad[0],1);return false}
    const oldSub=subtotal(r),oldTot=total(r),oldDep=cautionDue(r),t=nowLocal();
    r.lines=lines;const newSub=subtotal(r);if(r.discount>0&&oldSub>0)r.discount=Math.round(r.discount*newSub/oldSub);
    r.deposit=depositFor(r);
    if(inc.length)(r.addons=r.addons||[]).push({id:uid('f'),at:t,by:S.me,lines:inc});
    const over=Math.max(0,paid(r)-total(r)),overC=Math.max(0,cautionPaid(r)-r.deposit);
    if(over>0)r.payments.push({id:uid('y'),date:TODAY,at:t,amount:-over,method:v.method,by:S.me,kind:'location'});
    if(overC>0)r.payments.push({id:uid('y'),date:TODAY,at:t,amount:-overC,method:v.method,by:S.me,kind:'caution'});
    const note=notes.join(' ; ');const ed={id:uid('e'),at:t,by:S.me,note,delta:total(r)-oldTot,depDelta:r.deposit-oldDep,refund:over+overC};
    (r.edits=r.edits||[]).push(ed);r.editedAt=t;r.editNote=note;save();
    const rest=restToPay(r);
    toast('Commande modifiée : nouveau total '+F(total(r))+' ('+(ed.delta>=0?'+':'−')+F(Math.abs(ed.delta))+'), caution '+F(r.deposit)+'.'+(rest>0?' Reste à encaisser : '+F(rest)+'.':'')+(over+overC>0?' Remboursement au client : '+F(over+overC)+'.':'')+(r.prepared?' L’entrepôt doit revérifier le matériel.':''));
    setTimeout(()=>{render();showRental(id)},0);
  }});
}

function unlinkPack(nl){const d=ui.draft;nl.pr=null;nl.pk=null;d.lines.forEach(t=>{if(t.pack===nl.pid)t.pack=null})}
function setQty(pid,q,silent){
  const d=ui.draft,p=prod(pid);let l=d.lines.find(x=>x.pid===pid);
  if(l&&l.pk!=null&&q!==l.pk){unlinkPack(l);if(q>0)toast('Prix forfait retiré : la quantité n’est plus celle des tables.',1)}
  let a=avail(p,d.delivDate||d.start,d.pickDate||d.end,d.editId),nl=l&&l.pack?d.lines.find(x=>x.pid===l.pack):null;
  if(nl){a=Math.min(a,avail(prod(nl.pid),d.delivDate||d.start,d.pickDate||d.end,d.editId))}
  if(q>a){q=Math.max(0,a);toast(a>0?`Seulement ${a} « ${p.name} » disponible(s) pour ces dates.`:`« ${p.name} » n’est plus disponible pour ces dates.`,1)}
  if(q<=0){d.lines=d.lines.filter(x=>x.pid!==pid);if(nl){d.lines=d.lines.filter(x=>x!==nl)}}
  else if(l){l.qty=q;if(nl){nl.qty=q;nl.pk=q}}else d.lines.push({pid,qty:q});
  refreshTile(pid);refreshLots(pid);if(nl)refreshTile(nl.pid);if(!silent)drawCart();
}
function applyPack(tpid,nid){
  const d=ui.draft,t=d.lines.find(x=>x.pid===tpid);if(!t)return;
  const old=t.pack?d.lines.find(x=>x.pid===t.pack):null;
  if(old){const pure=old.pk===old.qty;unlinkPack(old);if(pure)d.lines=d.lines.filter(x=>x!==old);refreshTile(old.pid)}
  t.pack=null;
  if(nid){
    const tp=prod(tpid),np=prod(nid),pk=packOf(tp);
    const a=avail(np,d.delivDate||d.start,d.pickDate||d.end,d.editId);
    if(a<t.qty){toast(`Seulement ${Math.max(0,a)} « ${np.name} » disponible(s) : réduisez le nombre de tables ou choisissez une autre couleur.`,1);drawCart();return}
    let nl=d.lines.find(x=>x.pid===nid);if(!nl){nl={pid:nid,qty:t.qty};d.lines.push(nl)}
    nl.qty=t.qty;nl.pk=t.qty;nl.pr=Math.max(0,pk.price-tp.price);t.pack=nid;refreshTile(nid);
  }
  drawCart();
}
function validateDraft(){

  if(!d.eventName.trim()){toast('Donnez un nom à l’événement.',1);return false}
  if(!d.lines.length){toast('Ajoutez au moins un article.',1);return false}
  if(d.end<d.start){toast('La date de fin est avant la date de début.',1);return false}
  if(d.delivDate&&d.delivDate>d.start){toast('Le jour de livraison ne peut pas être après le début de l’événement.',1);return false}
  if(d.pickDate&&d.pickDate<d.end){toast('Le jour de récupération ne peut pas être avant la fin de l’événement.',1);return false}
  return true;
}

  if(!r){S.seq.rental++;r={id:uid('r'),no:nextQuoteNo(),payments:[],fees:0,lost:{},created:nowLocal(),by:S.me,deposit:0,depositState:null,depositRetained:0,depositClosedOn:null,depositBack:0,holdUntil:null,prepared:false,incidents:[],regul:false};S.rentals.push(r)}
  Object.assign(r,{delivCommune:d.commune||'',delivZone:d.zone||'',delivAddr:d.addr||'',delivSlot:d.delivSlot||'',pickSlot:d.pickSlot||'',clientId:d.clientId,eventName:d.eventName.trim(),eventType:d.eventType,source:d.source,start:d.start,end:d.end,delivDate:(d.delivDate&&d.delivDate!==d.start)?d.delivDate:'',pickDate:(d.pickDate&&d.pickDate!==d.end)?d.pickDate:'',lines,delivery:num(d.delivery),discount:discAmt(d),notes:d.notes,status});

  if(status==='Confirmée'){
    giveInvoice(r);
    const t=nowLocal();
    r.payments.push({id:uid('y'),date:TODAY,at:t,amount:Math.round(num(d.payAmount)),method:d.payMethod,by:S.me,kind:'location'});
    r.deposit=depositFor(r);r.holdUntil=null;

  }
  save();ui.draft=null;ui.view='rentals';render();window.scrollTo(0,0);
  toast(status==='Devis'?'Devis enregistré.':status==='Pré-réservation'?'Stock bloqué pour '+d.holdH+' h.':'Commande confirmée.');showRental(r.id);

/* changement d'état manuel : seul moyen de sortir une pièce d'« En entretien » ou « Endommagé » */
const TRANS=[['dispo>maint','Disponible → En entretien'],['maint>dispo','En entretien → Disponible (remise en service)'],['dispo>dmg','Disponible → Endommagé'],['dmg>maint','Endommagé → En entretien (réparation)'],['dmg>dispo','Endommagé → Disponible (réparé)'],['dmg>rebut','Endommagé → Mis au rebut (sort du parc)'],['maint>rebut','En entretien → Mis au rebut (sort du parc)'],['dispo>rebut','Disponible → Mis au rebut (sort du parc)']];
const MAINT_OK=['dispo>maint','dispo>dmg','dmg>maint'];
const transFor=()=>can('restock')?TRANS:TRANS.filter(t=>MAINT_OK.includes(t[0]));
function stateForm(id){
  const p=prod(id),phys=usable(p)-outNow(p.id);
  formModal({title:'Changer l’état — '+p.name,narrow:true,fields:[
    {k:'tr',label:'Changement',type:'select',full:true,options:transFor(),hint:`Disponible en magasin : ${Math.max(0,phys)} · En entretien : ${p.maint||0} · Endommagé : ${p.dmg||0}`},
    {k:'qty',label:'Quantité',type:'number',min:1,step:1,required:true,full:true,value:1},
    {k:'note',label:'Motif (facultatif)',full:true}],
   submit:'Enregistrer le changement',onSubmit:v=>{
    if(!can('stateEdit')||!transFor().some(t=>t[0]===v.tr)){toast(can('stateEdit')?'La remise en stock et le rebut sont réservés au service stock. Utilisez « Signaler au stock ».':'Droit insuffisant.',1);return false}

    const [from,to]=v.tr.split('>');
    const have=from==='dispo'?Math.max(0,phys):from==='maint'?(p.maint||0):(p.dmg||0);
    if(q>have){toast('Seulement '+have+' pièce(s) dans l’état de départ.',1);return false}

    if(to==='rebut'){p.stock=Math.max(0,p.stock-q);addMove(id,'Rebut',-q,'',(TRANS.find(t=>t[0]===v.tr)[1])+(v.note?' — '+v.note:''))}

   }});
}
function adjustForm(id){

function findProd(name){return S.products.find(x=>x.name.toLowerCase()===String(name||'').trim().toLowerCase())}

const SRC_LABEL={dmg:'Endommagé',maint:'En entretien',dispo:'Disponible'};
/* Mise en rebut : décidée et enregistrée par le service stock (l’entretien et le commercial signalent seulement) */
function rebutForm(pid){
  if(me().role!=='admin'&&can('transform')){proposeForm('rebut',pid);return}
  if(!can('stock')){toast('Seul le service stock met un article au rebut. L’entretien et le commercial peuvent le signaler.',1);return}
  const p0=pid?prod(pid):null;
  formModal({title:'Mettre un article au rebut',narrow:true,fields:[

   submit:'Mettre au rebut',onSubmit:v=>{

function depGroup(r){
  if(!r.deposit)return null;
  if(r.status==='Retournée')return r.depositClosedOn?'done':'back';
  if(r.status==='Confirmée'||r.status==='Sortie')return cautionPaid(r)>=r.deposit?'held':'due';
  return null;
}
function vDeposits(){
  const tabs=[['due','À encaisser'],['held','Détenues (en cours)'],['back','À restituer / retenir'],['done','Clôturées']];
  const rs=S.rentals.filter(r=>depGroup(r)===ui.depTab).sort((a,b)=>b.start.localeCompare(a.start));

/* ============ support : signaler un problème par WhatsApp (message complet et structuré) ============ */
const SUP_SECTIONS=['Connexion / mon compte','Nouvelle commande (devis ou commande)','Commandes (liste ou fiche d’une commande)','Paiements et caisse du jour','Cautions','Catalogue & stock','Mouvements de stock / rebut','Clients','Fournisseurs & achats','Rapports','Documents imprimés (facture, décharge, bon de commande…)','Autre'];
const SUP_KINDS=['Un message d’erreur s’affiche','Un bouton ou un lien ne fait rien','Un montant, un total ou un prix est faux','Un stock ou une disponibilité est faux','Je ne retrouve pas une commande, un client ou un article','L’impression ou le PDF ne fonctionne pas','Les données ne s’enregistrent pas ou disparaissent','La page est lente ou bloquée','Je n’ai pas accès à une fonction (droits)','Autre'];
const SUP_URG=['Bloquant : je ne peux plus travailler','Gênant : je peux continuer autrement','Mineur : pas urgent'];
const SUP_FREQ=['Première fois','Ça arrive de temps en temps','Ça arrive à chaque fois'];
const SUP_VIEW={dash:1,rentals:2,pos:1,stock:5,cash:3,deposits:4,moves:6,rebut:6,clients:7,suppliers:8,reports:9,team:0,settings:0};
const supNew=()=>({type:'Incident',section:'',kind:'',urg:'',freq:'',order:'',noOrder:'',client:'',article:'',shown:'',expected:'',err:'',did:'',saw:'',phone:''});
const supInc=s=>s.type!=='Nouvelle demande';
const supNeedsOrder=s=>supInc(s)&&/^(Nouvelle commande|Commandes|Paiements|Cautions|Documents)/.test(s.section);
const supNeedsClient=s=>supNeedsOrder(s)||(supInc(s)&&s.section==='Clients');
const supNeedsArticle=s=>supInc(s)&&(/^(Catalogue|Mouvements)/.test(s.section)||/stock ou une disponibilité|retrouve/.test(s.kind));
const SUP_WHEN=['Dès que possible','Dans le mois','Pas pressé'];
function supBrowser(){
  const u=navigator.userAgent||'',b=/Edg\//.test(u)?'Edge':/OPR\//.test(u)?'Opera':/Chrome\//.test(u)?'Chrome':/Firefox\//.test(u)?'Firefox':/Safari\//.test(u)?'Safari':'navigateur inconnu';
  const o=/iPhone|iPad/.test(u)?'iPhone/iPad':/Android/.test(u)?'Android':/Mac/.test(u)?'Mac':/Windows/.test(u)?'Windows':/Linux/.test(u)?'Linux':'système inconnu';
  return b+' sur '+o+', écran '+screen.width+'×'+screen.height+', connexion '+(navigator.onLine?'active':'COUPÉE');
}
function supMsg(no){
  const s=ui.sup||supNew(),d=new Date(),p=n=>String(n).padStart(2,'0');
  const when=p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' à '+p(d.getHours())+'h'+p(d.getMinutes());
  const from=ui.supFrom&&TITLES[ui.supFrom]?TITLES[ui.supFrom]:'—';
  const L=[],inc=supInc(s),ref=no?' '+no:'';
  L.push(inc?'🛠 *SUPPORT TuskIQ Location — incident'+ref+'*':'✨ *SUPPORT TuskIQ Location — nouvelle demande'+ref+'*','');
  L.push('👤 *Qui :* '+me().name+' ('+ROLES[me().role]+')');
  L.push('🕒 *Quand :* '+when);
  L.push('📍 *Partie concernée :* '+(s.section||'—'));
  if(inc){
    L.push('❗ *Type de problème :* '+(s.kind||'—'));
    L.push('🚦 *Urgence :* '+(s.urg||'—'));
    if(s.freq)L.push('🔁 *Fréquence :* '+s.freq);
    if(supNeedsOrder(s))L.push('🧾 *N° de commande / facture :* '+(s.noOrder?'aucune commande concernée':(s.order||'—')));
    if(supNeedsClient(s)&&s.client)L.push('👥 *Client :* '+s.client);
    if(supNeedsArticle(s)&&s.article)L.push('📦 *Article :* '+s.article);
    if(/montant/.test(s.kind))L.push('💰 *Montant affiché :* '+(s.shown||'—')+'   |   *Montant attendu :* '+(s.expected||'—'));
    L.push('');
    L.push('*Ce que je faisais (étape par étape) :*',s.did||'—','');
    L.push('*Ce que je m’attendais à voir :*',s.saw||'—','');
    if(/erreur/.test(s.kind)||s.err)L.push('*Message affiché (recopié) :*',s.err||'—','');
  }else{
    L.push('🚦 *Souhaitée :* '+(s.urg||'—'));
    L.push('');
    L.push('*Ce que je voudrais pouvoir faire :*',s.did||'—','');
    L.push('*Pourquoi c’est utile (dans quel cas) :*',s.saw||'—','');
    if(s.expected)L.push('*Exemple concret :*',s.expected,'');
  }
  if(s.phone)L.push('📞 *Me joindre au :* '+s.phone,'');
  L.push('ℹ️ _Infos automatiques : '+supBrowser()+' ; page ouverte juste avant : '+from+'_');
  return L.join('\n');
}

  const s=ui.sup,inc=supInc(s);
  let h=`<div class="sup-type"><button type="button" class="${inc?'on':''}" data-act="supType" data-v="Incident"><b>🛠 Un incident</b><small>Quelque chose ne fonctionne pas comme prévu</small></button><button type="button" class="${inc?'':'on'}" data-act="supType" data-v="Nouvelle demande"><b>✨ Une nouvelle demande</b><small>Une amélioration ou une fonction en plus</small></button></div>`;

  if(supNeedsOrder(s))h+=`<div class="grid2"><div class="field"><label>N° de commande ou de facture *</label><input data-in="sup" data-k="order" value="${esc(s.order)}" placeholder="Ex. 0087-10-26 ou DEV-2026-0001" ${s.noOrder?'disabled':''}><label class="chk" style="margin-top:4px"><input type="checkbox" data-in="sup" data-k="noOrder" ${s.noOrder?'checked':''} style="width:auto"> Aucune commande n’est concernée</label></div>${supTxt('client','Client concerné','Nom du client')}</div>`;
  else if(s.section==='Clients')h+=supTxt('client','Client concerné','Nom du client');
  if(supNeedsArticle(s))h+=supTxt('article','Article concerné','Nom ou référence (ex. CHX-020)');
  if(/montant/.test(s.kind))h+=`<div class="grid2">${supTxt('shown','Montant affiché (faux)','Ex. 53 000 F')}${supTxt('expected','Montant attendu','Ex. 44 000 F')}</div>`;
  h+=supTxt('did','Que faisiez-vous exactement ? (étape par étape)','Ex. : J’ai ouvert la commande 0087, j’ai cliqué sur « Enregistrer le paiement », j’ai saisi 50 000 F…',1,1);
  h+=supTxt('saw','Que s’attendiez-vous à voir ?','Ex. : Le paiement ajouté et le reste à payer mis à jour',0,1);
  if(/erreur/.test(s.kind))h+=supTxt('err','Message d’erreur affiché (recopiez-le mot pour mot)','Copiez le texte rouge ou la fenêtre qui s’affiche',1,1);
  h+=`<div class="grid2">${supSel('urg','Urgence',SUP_URG,1)}${supSel('freq','Est-ce déjà arrivé ?',SUP_FREQ,0)}</div>`;
  h+=supTxt('phone','Pour vous joindre (facultatif)','Ex. 07 00 00 00 00');
  return h;
}
